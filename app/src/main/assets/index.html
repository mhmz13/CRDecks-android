function cmp(){const wr=d=>d.mine&&(d.mine[0]+d.mine[1])?d.mine[0]/(d.mine[0]+d.mine[1]):-1,gm=d=>d.mine?d.mine[0]+d.mine[1]:0,fv=d=>isFav(d.key)?1:0,tw=d=>d.tier==="main"?2:d.tier==="test"?1:0;
  const pop=(a,b)=>tw(b)-tw(a)||(b.mine?1:0)-(a.mine?1:0)||(b.user?1:0)-(a.user?1:0)||b.pop-a.pop||a.title.localeCompare(b.title);
  return {pop,fav:(a,b)=>fv(b)-fv(a)||pop(a,b),new:(a,b)=>(b.added||b.i)-(a.added||a.i),mywr:(a,b)=>wr(b)-wr(a)||gm(b)-gm(a)||pop(a,b),mygames:(a,b)=>gm(b)-gm(a)||wr(b)-wr(a)||pop(a,b),low:(a,b)=>a.avg-b.avg,high:(a,b)=>b.avg-a.avg,name:(a,b)=>a.title.localeCompare(b.title)}[S.sort]||pop}

let BSTORE=[],BIDB=null;
const BMODES={pathOfLegend:"Ranked (Path of Legends)",PvP:"Trophy Road",challenge:"Challenges",riverRacePvP:"Clan war",friendly:"Friendly"};
const bDate=t=>new Date(t.replace(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d).*$/,"$1-$2-$3T$4:$5:$6Z"));
const bFmt=t=>bDate(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
function allBattles(){const m={};BSEED.forEach(b=>m[b.t]=b);BSTORE.forEach(b=>{if(b&&b.t)m[b.t]=b});
  Object.values(m).forEach(b=>{if(b.ci)for(const [n,v] of Object.entries(b.ci)){if(!NAMEID[n])NAMEID[n]=v;if(!CARDS[v[0]])CARDS[v[0]]=[n,v[1]]}});
  return Object.values(m).sort((a,b)=>a.t<b.t?-1:1)}
function bLink(cards,tower){const ids=cards.map(n=>NAMEID[n]&&NAMEID[n][0]);if(cards.length!==8||ids.some(x=>!x))return "";return linkOf(ids,TTID[tower])}
function bAvg(cards){const c=cards.map(n=>NAMEID[n]&&NAMEID[n][1]).filter(x=>x!=null);return c.length?c.reduce((a,b)=>a+b,0)/c.length:0}
function bKey(cards){const ids=cards.map(n=>NAMEID[n]&&NAMEID[n][0]);return ids.some(x=>!x)?null:dkey(ids)}
function bLabel(cards,roles){const sp=cards.filter(n=>roles[n]).map(n=>(roles[n]==="evo"?"Evo ":"Hero ")+n);const ch=cards.filter(n=>!roles[n]&&CHAMPS.has(n));return [...sp,...ch].slice(0,3).join(" · ")||cards.slice(0,3).join(" · ")}
function bGroup(B,mine){const g={};B.forEach(b=>{const cs=mine?b.cards:b.opp;if(!cs||cs.length<8)return;const ro=(mine?b.roles:b.oroles)||{};const k=[...cs].sort().join("|")+"#"+Object.entries(ro).sort().join();(g[k]=g[k]||{g:[]}).g.push(b)});
  return Object.values(g).map(d=>{d.last=d.g[d.g.length-1];d.cards=mine?d.last.cards:d.last.opp;d.roles=(mine?d.last.roles:d.last.oroles)||{};d.tower=(mine?d.last.tower:d.last.otower)||"";d.w=d.g.filter(b=>b.me>b.op).length;d.l=d.g.length-d.w;return d})}
function bDeckHTML(d,mine,q){const n=d.g.length,k=bKey(d.cards),lib=k&&BYKEY[k]&&!BYKEY[k].oppOnly?BYKEY[k]:null,link=bLink(d.cards,d.tower);

  return `<article class="dk"><div class="dh"><div class="dt"><h3>${esc(lib?lib.title:bLabel(d.cards,d.roles))}</h3><div class="sub">${mine?"Last played":"Last faced"} ${esc(bFmt(d.last.t))}${d.tower?" · "+esc(d.tower):""}</div></div><span class="elx"><span class="drop"></span>${bAvg(d.cards).toFixed(1)}</span>${k?favBtn(k):""}</div>

const BFAV={};
function renderBat(){const mine=BV.side==="played";const all=allBattles();const modes=uniq(all.map(b=>b.mode));

function wireBat(){const m=$("bmode"),s=$("bsort"),f=$("bimp");if(m)m.onchange=()=>{BV.mode=m.value;savePrefs();render()};if(s)s.onchange=()=>{BV.sort=s.value;savePrefs();render()};if(f)f.onchange=importCSV}
function parseCSV(text){const rows=[];let row=[],f="",q=false;for(let i=0;i<text.length;i++){const c=text[i];
  if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=""}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=""}else f+=c}

function toBattle(r){if(!r.battleTime||!r.team_0_cards_0_name)return null;const num=x=>x===""||x==null?null:Number(x);const ci={};
  const side=p=>{const cards=[],roles={};for(let k=0;k<8;k++){const n=r[`${p}_cards_${k}_name`];if(!n)continue;cards.push(n);const ev=parseFloat(r[`${p}_cards_${k}_evolutionLevel`]);if(ev>0)roles[n]=ev>=2?"hero":"evo";const id=num(r[`${p}_cards_${k}_id`]),c=num(r[`${p}_cards_${k}_elixirCost`]);if(id)ci[n]=[id,c??0]}return{cards,roles}};
  const me=side("team_0"),op=side("opponent_0");if(me.cards.length<8)return null;
  return{t:r.battleTime,mode:r.type||"",cards:me.cards,roles:me.roles,tower:r.team_0_supportCards_0_name||"",me:num(r.team_0_crowns)??0,op:num(r.opponent_0_crowns)??0,leak:num(r.team_0_elixirLeaked)??0,opp:op.cards,oroles:op.roles,otower:r.opponent_0_supportCards_0_name||"",ci}}
async function loadBattles(){try{BIDB=BIDB||await idbOpen("crd-battles","battles",{keyPath:"t"});BSTORE=await idbDo(BIDB,"battles","readonly",s=>s.getAll())}catch(_){BIDB=null}}
async function importCSV(e){const files=[...e.target.files];e.target.value="";if(!files.length)return;const st=$("bstat");st.textContent="Reading…";
  try{await loadBattles();if(!BIDB)throw 0;const have=new Set(allBattles().map(b=>b.t));let found=0,added=0;
    for(const f of files)for(const r of parseCSV(await f.text())){const b=toBattle(r);if(!b)continue;found++;if(have.has(b.t))continue;await idbDo(BIDB,"battles","readwrite",s=>s.put(b));have.add(b.t);added++}
    await loadBattles();render();toast(found?`Added ${added} new game${added===1?"":"s"}; ${found-added} already here.`:"No battles found. Use the battle CSV export from RoyaleAPI.")}
  catch(_){st.textContent="Import stopped. Try the same file again; games already saved are skipped."}}

/* ---------- add / edit a deck ---------- */
let ED=null; // {order:[ids], roles:{}, tt, title, arch, notes, editing:key|null, unknown:[]}
const slug=s=>s.toLowerCase().replace(/\./g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const BYSLUG={};for(const [id,[n]] of Object.entries(CARDS))BYSLUG[slug(n)]=Number(id);
function parseDeckText(t){t=String(t||"").trim();if(!t)return null;let dec=t;try{dec=decodeURIComponent(t.replace(/%(?![0-9a-f]{2})/gi,"%25"))}catch(_){}
  let m=dec.match(/deck=([0-9;,\s]+)/i);
  if(m){const ids=m[1].split(/[;,\s]+/).filter(Boolean).map(Number);const tt=(dec.match(/[?&]tt=(\d+)/)||[])[1]||"";return {order:ids.slice(0,8),tt,fromLink:true}}
  m=dec.match(/decks\/stats\/([a-z0-9,\-]+)/i);
  if(m){const roles={},order=[];for(let s of m[1].split(",")){let r="";if(/-ev1$/.test(s)){r="evo";s=s.replace(/-ev1$/,"")}else if(/-hero$/.test(s)){r="hero";s=s.replace(/-hero$/,"")}const id=BYSLUG[s];if(id){order.push(id);if(r)roles[id]=r}}return order.length?{order:order.slice(0,8),roles,tt:""}:null}
  const names=dec.split(/[\n,;]+/).map(x=>x.trim()).filter(Boolean);const order=[];for(const n of names){const id=BYSLUG[slug(n.replace(/^(evo|hero)\s+/i,""))];if(id)order.push(id)}
  return order.length>=1?{order:order.slice(0,8),roles:{},tt:""}:null}
function canEvo(id){return EVO.has(cname(id))}function canHero(id){return HERO.has(cname(id))}
function defaultRoles(order){const roles={};const a=order[0],b=order[1],c=order[2];
  if(a&&canEvo(a))roles[a]="evo";
  if(b){if(canHero(b))roles[b]="hero";else if(canEvo(b)&&!roles[a])roles[b]="evo"}
  if(c){if(canEvo(c))roles[c]="evo";else if(canHero(c))roles[c]="hero"}
  return roles}
function startAdd(parsed,extra){ED={order:[],roles:{},tt:"",title:"",arch:"",notes:"",editing:null,...(extra||{})};
  if(parsed){ED.order=parsed.order.map(Number);ED.tt=parsed.tt||"";ED.roles=parsed.roles&&Object.keys(parsed.roles).length?parsed.roles:(parsed.fromLink?defaultRoles(ED.order):{})}
  setView("add")}
function renderAdd(){$("count").textContent="";
  if(!ED){$("out").innerHTML=`<div class="page">
    <section class="card2"><h2>Add a deck from Clash Royale</h2><p>In the game, open the deck and tap <b>Share</b>, then choose <b>CR Decks</b>. The deck opens here, ready to save.</p><p>Or copy a deck link (from the game, RoyaleAPI or Deckshop) and paste it below.</p>
      <textarea id="addtxt" placeholder="Paste a deck link here" aria-label="Deck link"></textarea><div class="sbtns"><button class="btn" type="button" id="addpaste">Paste from clipboard</button><button class="btn gold grow" type="button" id="addgo">Continue</button></div><p class="msg" id="addmsg"></p></section>
    <section class="card2"><h2>Or build it card by card</h2><p>Pick 8 cards, then mark the evolution and hero slots.</p><button class="btn" type="button" id="addbuild">Pick cards</button></section>
    <section class="card2"><h2>From your battles</h2><p>Import a RoyaleAPI battle CSV in Battles, then tap <b>Save to my decks</b> on any deck you played or faced.</p></section></div>`;
    $("addgo").onclick=()=>{const p=parseDeckText($("addtxt").value);if(!p||!p.order.length){$("addmsg").textContent="That doesn't look like a deck link. It should contain deck= followed by card numbers.";$("addmsg").className="msg err";return}startAdd(p)};
    $("addpaste").onclick=async()=>{try{const t=window.AndroidClip&&AndroidClip.read?AndroidClip.read():await navigator.clipboard.readText();$("addtxt").value=t||"";if(t){const p=parseDeckText(t);if(p&&p.order.length)startAdd(p)}}catch(_){ $("addmsg").textContent="Clipboard reading is blocked here. Long-press the box and choose Paste.";$("addmsg").className="msg"}};
    $("addbuild").onclick=()=>startAdd(null);return}
  const full=ED.order.length===8;
  const unknown=ED.order.filter(id=>!CARDS[id]);
  const slots=[];for(let k=0;k<8;k++){const id=ED.order[k];slots.push(id?`<div data-slot="${k}">${tile(id,ED.roles[id])}</div>`:`<div class="cd emptyslot">${k+1}</div>`)}
  const existing=full&&BYKEY[dkey(ED.order)]&&!ED.editing?BYKEY[dkey(ED.order)]:null;

    ${existing?`<p class="msg">These 8 cards are already in your decks as “${esc(existing.title)}”. Saving adds this version as a new tab on that deck.</p>`:""}
    <div class="fld"><span class="lab">Name</span><input class="inp" id="edtitle" value="${esc(ED.title)}" placeholder="${esc(full?autoTitle(ED.roles,ED.order):"Deck name")}"></div>
    <div class="fld"><span class="lab">Archetype</span><input class="inp" id="edarch" list="archlist" value="${esc(ED.arch)}" placeholder="e.g. Hog Cycle"><datalist id="archlist">${ARCHS.map(a=>`<option value="${esc(a)}">`).join("")}</datalist></div>
    <div class="fld"><span class="lab">Tower troop</span><select id="edtt">${Object.entries(TTID).map(([n,v])=>`<option value="${v}"${String(v)===String(ED.tt||159000000)?" selected":""}>${n}</option>`).join("")}</select></div>
    <div class="fld"><span class="lab">Notes</span><textarea id="ednotes" placeholder="Swaps, matchups, anything">${esc(ED.notes)}</textarea></div>
    <div class="sbtns"><button class="btn" type="button" id="edcancel">Cancel</button><button class="btn gold grow" type="button" id="edsave"${full?"":" disabled"}>Save deck</button></div><p class="msg" id="edmsg"></p></section>
    ${full?"":`<section class="card2"><input class="search" id="pickq" placeholder="Search cards" autocomplete="off"><div class="pickgrid" id="pickgrid"></div></section>`}</div>`;
  const keep=()=>{ED.title=$("edtitle").value;ED.arch=$("edarch").value;ED.notes=$("ednotes").value;ED.tt=$("edtt").value};
  ["edtitle","edarch","ednotes","edtt"].forEach(id=>$(id).addEventListener("input",keep));$("edtt").onchange=keep;
  let pressT=null,pressed=false;
  $("slots").querySelectorAll("[data-slot]").forEach(el=>{const k=+el.dataset.slot,id=ED.order[k];
    el.onpointerdown=()=>{pressed=false;pressT=setTimeout(()=>{pressed=true;keep();ED.order.splice(k,1);delete ED.roles[id];renderAdd()},550)};
    el.onpointerup=el.onpointerleave=el.onpointercancel=()=>clearTimeout(pressT);
    el.onclick=()=>{if(pressed)return;keep();const opts=[""].concat(canEvo(id)?["evo"]:[]).concat(canHero(id)?["hero"]:[]);if(opts.length===1){toast(cname(id)+" has no Evo or Hero form.");return}const cur=ED.roles[id]||"";const nx=opts[(opts.indexOf(cur)+1)%opts.length];if(nx)ED.roles[id]=nx;else delete ED.roles[id];
      const sp=Object.values(ED.roles).filter(Boolean).length;if(sp>3)toast("That's more than 3 Evo/Hero slots. The game allows 3.");renderAdd()};
    el.oncontextmenu=e=>e.preventDefault()});
  $("edcancel").onclick=()=>{ED=null;renderAdd()};
  $("edsave").onclick=()=>{keep();saveEd()};
  if(!full){const all=Object.keys(CARDS).map(Number).filter(id=>id<29000000&&String(id).slice(0,2)!=="36").sort((a,b)=>ccost(a)-ccost(b)||cname(a).localeCompare(cname(b)));
    const draw=()=>{const s=$("pickq").value.trim().toLowerCase();$("pickgrid").innerHTML=all.filter(id=>!s||cname(id).toLowerCase().includes(s)).sort((a,b)=>s?((cname(a).toLowerCase()===s?0:cname(a).toLowerCase().startsWith(s)?1:2)-(cname(b).toLowerCase()===s?0:cname(b).toLowerCase().startsWith(s)?1:2)):0).map(id=>`<div data-pick="${id}" class="${ED.order.includes(id)?"on":""}">${tile(id)}</div>`).join("")};
    draw();$("pickq").oninput=draw;
    $("pickgrid").onclick=e=>{const p=e.target.closest("[data-pick]");if(!p)return;keep();const id=+p.dataset.pick;const at=ED.order.indexOf(id);if(at>=0){ED.order.splice(at,1);delete ED.roles[id]}else if(ED.order.length<8)ED.order.push(id);renderAdd();if(ED.order.length<8)$("pickq").focus()}}}
function saveEd(){const msg=$("edmsg");
  for(const id of ED.order.filter(id=>!CARDS[id])){const n=document.querySelector(`[data-unk-n="${id}"]`).value.trim(),c=parseInt(document.querySelector(`[data-unk-c="${id}"]`).value,10);
    if(!n||isNaN(c)){msg.textContent="Give each new card a name and an elixir cost.";msg.className="msg err";return}CUSTOM[id]=[n,c];CARDS[id]=[n,c]}
  lsSet("crd-cards",CUSTOM);
  const roles={};for(const id of ED.order)if(ED.roles[id])roles[id]=ED.roles[id];
  // evo/hero cards go first so the game's link puts them in the special slots
  const sp=ED.order.filter(id=>roles[id]),rest=ED.order.filter(id=>!roles[id]);const order=sp.concat(rest);
  const key=dkey(order),now=Date.now(),v={order,roles,tt:ED.tt||"159000000",added:now};
  const arch=ED.arch.trim()?[ED.arch.trim()]:[];
  if(ED.editing){const u=USER.find(x=>x.key===ED.editing);if(u){USER=USER.filter(x=>x!==u);const nu={...u,key,title:ED.title.trim(),arch,notes:ED.notes.trim(),variants:[{...u.variants[0],...v,added:u.variants[0].added||now}].concat(u.variants.slice(1))};USER.push(nu)}}
  else{const u=USER.find(x=>x.key===key);if(u){u.variants.unshift(v);if(ED.title.trim())u.title=ED.title.trim();if(arch.length)u.arch=arch;if(ED.notes.trim())u.notes=ED.notes.trim()}else USER.push({key,title:ED.title.trim(),arch,notes:ED.notes.trim(),added:now,variants:[v]})}
  saveUser();ED=null;toast("Deck saved.");S={...S,sec:"all",q:"",only:BYKEY[key]?BYKEY[key].i:null};$("q").value="";setView("lib")}

  $("out").innerHTML=`<div class="page">
  <section class="card2"><h2>Back up or move everything</h2><p>One file with your added decks, favorites, hidden decks, imported battles, the pictures you added and your Elixir Lab progress. Open it here on another phone, or after reinstalling.</p>

  if($("unhide"))$("unhide").onclick=()=>{HIDDEN.clear();lsSet("crd-hidden",[]);renderMore();toast("All decks are visible again.")}}
function galCards(){const seen=new Set(),L=[];for(const [id,v] of Object.entries(CARDS)){if(!/^2[678]/.test(id)||!v||!v[0]||seen.has(v[0]))continue;seen.add(v[0]);L.push({id:+id,n:v[0],c:v[1]})}return L.sort((a,b)=>a.n.localeCompare(b.n))}
function galForms(c){return ["base",...(EVO.has(c.n)?["evo"]:[]),...(HERO.has(c.n)?["hero"]:[])]}
function galUrl(c,fm){const k=c.id+"_"+fm;if(k in UPICS)return UPICS[k]||null;return BPICS.has(k)?"pics/"+k+".webp":null}
function galGrid(){const all=galCards();let L=all;const q=GQ.trim().toLowerCase();if(q)L=L.filter(c=>c.n.toLowerCase().includes(q));
  if(GF==="missing")L=L.filter(c=>galForms(c).some(f=>!galUrl(c,f)));if(GF==="evo")L=L.filter(c=>EVO.has(c.n));if(GF==="hero")L=L.filter(c=>HERO.has(c.n));
  let tot=0,got=0;for(const c of all)for(const f of galForms(c)){tot++;if(galUrl(c,f))got++}
  $("galnote").textContent=`${got} of ${tot} pictures set. Tap a tile to add or change it.`;
  $("galgrid").innerHTML=L.map(c=>`<div class="grow2"><div class="gname"><span>${esc(c.n)}</span><span class="gcost">${c.c}</span></div><div class="gforms">${galForms(c).map(f=>{const u=galUrl(c,f);const lab=f==="base"?"Normal":f==="evo"?"Evo":"Hero";return `<button type="button" class="gtile ${f}${u?"":" empty"}" data-gid="${c.id}" data-gf="${f}" aria-label="${esc(lab+" "+c.n)}">${u?`<img src="${esc(u)}" alt="" loading="lazy" decoding="async">`:`<span class="plus">+</span>`}<span class="gl">${lab}</span></button>`}).join("")}</div></div>`).join("")||`<p class="hint">No card matches that search.</p>`}
function renderGallery(){$("out").innerHTML=`<div class="page"><section class="card2"><div class="sbtns"><button class="btn" type="button" id="galback">← Back to More</button></div><h2>Card gallery</h2>
  <input type="search" class="search" id="galq" placeholder="Search a card" value="${esc(GQ)}" aria-label="Search a card">
  <div class="chips" style="margin-top:8px">${[["all","All cards"],["missing","Missing a picture"],["evo","Evolutions"],["hero","Heroes"]].map(([k,l])=>`<button class="chip" type="button" data-galf="${k}" aria-pressed="${GF===k}">${l}</button>`).join("")}</div>

async function blobToData(b){return await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)})}
async function saveBackup(){const msg=$("bkmsg");msg.textContent="Preparing…";
  try{const pics={};if(PIDB){const keys=await idbDo(PIDB,"pics","readonly",s=>s.getAllKeys());for(const k of keys){const b=await idbDo(PIDB,"pics","readonly",s=>s.get(k));pics[k]=b?await blobToData(b):null}}
    await loadBattles();
    const json=JSON.stringify({app:"cr-decks",v:1,at:Date.now(),user:USER,favs:FAVS,hidden:[...HIDDEN],cards:CUSTOM,battles:BSTORE,pics,lab:{settings:lsGet("elab-settings",null),history:lsGet("elab-history",null)},place:{best:lsGet("crplace-best",null),course:lsGet("hog26-course",null),v2:lsGet("hog26-v2",null)}});
    const d=new Date(),z=n=>String(n).padStart(2,"0"),name=`cr-decks-backup-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}.json`;
    if(window.AndroidFile){AndroidFile.save(name,json);msg.textContent="Choose where to save the file…";return}
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([json],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove();msg.textContent="Backup downloaded."}
  catch(e){msg.textContent="Couldn't make the backup: "+(e.message||e)}}
window.onAndroidSaved=ok=>{const m=$("bkmsg");if(m)m.textContent=ok?"Backup saved.":"The file wasn't saved."};
let PENDING=null;
async function restoreBackup(e){const f=e.target.files[0];e.target.value="";if(!f)return;const msg=$("bkmsg");
  try{const j=JSON.parse(await f.text());if(j.app!=="cr-decks")throw new Error("not a CR Decks backup");
    if(PENDING!==j.at){PENDING=j.at;msg.textContent=`Backup from ${fmtDate(j.at)}: ${j.user.length} added decks, ${Object.keys(j.favs||{}).length} favorites, ${(j.battles||[]).length} battles. Choose the file again to replace what's on this phone.`;return}
    PENDING=null;USER=j.user||[];FAVS=j.favs||{};HIDDEN=new Set(j.hidden||[]);CUSTOM=j.cards||{};
    lsSet("crd-user",USER);lsSet("crd-favs",FAVS);lsSet("crd-hidden",[...HIDDEN]);lsSet("crd-cards",CUSTOM);for(const [id,v] of Object.entries(CUSTOM))CARDS[id]=v;
    if(j.lab){if(j.lab.settings)lsSet("elab-settings",j.lab.settings);if(j.lab.history)lsSet("elab-history",j.lab.history);LABH.api=null}
    if(j.place){if(j.place.best)lsSet("crplace-best",j.place.best);if(j.place.course)lsSet("hog26-course",j.place.course);if(j.place.v2)lsSet("hog26-v2",j.place.v2)}
    await loadBattles();if(BIDB){await idbDo(BIDB,"battles","readwrite",s=>s.clear());for(const b of j.battles||[])await idbDo(BIDB,"battles","readwrite",s=>s.put(b))}
    PIDB=PIDB||await idbOpen("crd-pics","pics");await idbDo(PIDB,"pics","readwrite",s=>s.clear());
    for(const [k,u] of Object.entries(j.pics||{})){const b=u?await (await fetch(u)).blob():null;await idbDo(PIDB,"pics","readwrite",s=>s.put(b,k))}
    await loadPics();await loadBattles();rebuild();toast("Backup restored.");renderMore()}
  catch(err){msg.textContent="That file couldn't be restored: "+(err.message||err)}}

  <div class="fld"><span class="lab">Meta period</span>${sel("fera","All meta periods",ERA_OPTS.slice(1),S.era)}</div>
  <div class="fld"><span class="lab">Tower troop</span>${sel("ftower","Any tower troop",towers,S.tower)}</div>
  <div class="fld"><span class="lab">Your picks</span><div class="wrapchips">${PICKS.map(([l,p],k)=>`<button class="chip" type="button" data-pk="${k}" aria-pressed="${Object.entries(p).every(([a,b])=>S[a]===b)}">${l}</button>`).join("")}</div></div>
  <div class="sbtns"><button class="btn" type="button" id="fclear">Clear filters</button><button class="btn gold grow" type="button" id="fdone">Show decks</button></div>`);
  const apply=()=>{S.sort=$("fsort").value;S.arch=$("farch").value;S.spec=$("fspec").value;S.era=$("fera").value;S.tower=$("ftower").value;savePrefs()};
  $("fdone").onclick=()=>{apply();S.only=null;closeSheet();syncTop();render();scrollTo(0,0)};
  $("fclear").onclick=()=>{S={...S,arch:"",spec:"",era:"",tower:"",sec:"all",only:null};closeSheet();syncTop();render()};
  $("sheetBody").querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{const p=PICKS[+b.dataset.pk][1];const on=b.getAttribute("aria-pressed")==="true";["farch","fspec","ftower"].forEach(id=>$(id).value="");if(!on){if(p.arch)$("farch").value=p.arch;if(p.spec)$("fspec").value=p.spec;if(p.tower)$("ftower").value=p.tower}apply();S.only=null;closeSheet();syncTop();render();scrollTo(0,0)})}


/* ---------- Elixir Lab tab ---------- */
// Lab decks are built from this app's decks (data.js plus the ones you added, minus hidden ones). Each version (tab) of a deck
// becomes one Lab deck. Groups: meta = RoyaleAPI/RoyaleTracker/Asaf lists, faced = opponents' decks, mine = decks you play or
// added, liked = your liked lists and your favorites.
const LABH={on:[],api:null,sig:""};
function labRAW(){
  const cards={};for(const [id,v] of Object.entries(CARDS))if(v&&v[0]&&!(v[0] in cards))cards[v[0]]=[Number(id),v[1]];
  const decks=[];
  for(const d of D){if(HIDDEN.has(d.key))continue;const seen=new Set();
    d.variants.forEach((v,vi)=>{const order=(v.order&&v.order.length===8?v.order:d.ids).map(x=>normId(Number(x)));const r={};
      for(const [id,ro] of Object.entries(v.roles||{}))if(ro)r[cname(normId(Number(id)))]=ro;
      const sg=JSON.stringify(Object.entries(r).sort());if(seen.has(sg))return;seen.add(sg);
      const src=v.srcs||[],g=new Set();
      if(src.some(x=>/^Opponent's deck/.test(x)))g.add("faced");
      if(src.some(x=>/liked/i.test(x))||isFav(d.key))g.add("liked");
      if(src.some(x=>/^(RoyaleAPI|RoyaleTracker|Asaf|Your old 'Current meta')/.test(x)))g.add("meta");
      if(d.mine||d.tier||d.userAdd||v.user||src.some(x=>/^(Your (?!'Decks I liked')|Removed from your game|Added by you)/.test(x)))g.add("mine");
      if(!g.size)g.add("meta");
      const multi=d.variants.length>1&&v.specials&&v.specials.length;
      decks.push({t:d.title+(multi&&vi>0?" · "+v.specials.join(" + "):""),g:[...g],a:d.arch||[],c:order.map(cname),r,tw:v.tower||"Tower Princess",m:d.mine||null,tier:d.tier||null,k:d.key+"#"+sg})})}
  return {cards,decks,champ:[...CHAMPS]};
}
function labPic(n,role){const id=LABH.ids[n];if(id==null)return null;return picFor(normId(id),role==="evo"||role==="hero"?role:"base")}
function labSig(){return [D.length,HIDDEN.size,Object.keys(FAVS).length,USER.length,Object.keys(UPICS).length].join("/")}
function mountLab(){
  const host=$("labhost");
  for(const [t,f] of LABH.on)document.removeEventListener(t,f);LABH.on=[];
  const root=host.shadowRoot||host.attachShadow({mode:"open"});
  root.innerHTML=`<style>${LABCSS}</style><div class="labroot"><div class="wrap" id="app"></div></div>`;
  const raw=labRAW();LABH.ids={};for(const [n,[id]] of Object.entries(raw.cards))LABH.ids[n]=id;
  LABH.api=ELAB_START(root,host,raw,labPic,()=>VIEW==="lab",(t,f)=>{document.addEventListener(t,f);LABH.on.push([t,f])});
  LABH.sig=labSig();
}
function renderLab(){$("count").textContent="";
  // rebuild only when your decks, favorites or pictures changed, and never in the middle of a match
  const inMatch=LABH.api&&$("labhost").shadowRoot&&$("labhost").shadowRoot.querySelector(".clockbar");
  if(!LABH.api||(LABH.sig!==labSig()&&!inMatch))mountLab()}

/* ---------- view switching ---------- */
const TITLES={lib:"My decks",fav:"Favorites",bat:"Battles",add:"Add a deck",lab:"Elixir Lab",place:"Placement Lab",more:"More"};
function syncTop(){const lib=VIEW==="lib";$("ttl").textContent=TITLES[VIEW];$("srow").hidden=!(lib||VIEW==="fav"||VIEW==="bat");$("fbtn").hidden=!lib;$("secchips").hidden=!lib;
  $("q").placeholder=VIEW==="bat"?"Search a card":"Search a card or deck";
  const n=!!S.arch+!!S.spec+!!S.era+!!S.tower;$("fbadge").hidden=!n;$("fbadge").textContent=n;
  $("secchips").innerHTML=SECS.map(([k,l])=>`<button class="chip" type="button" data-sec="${k}" aria-pressed="${S.sec===k}">${l}</button>`).join("");
  document.querySelectorAll(".nav [data-v]").forEach(b=>{if(b.dataset.v===VIEW)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")})}
function setView(v){if(VIEW==="lab"&&v!=="lab"&&LABH.api)LABH.api.pause();if(VIEW==="place"&&v!=="place"&&window.pausePlacementLab)pausePlacementLab();VIEW=v;const lab=v==="lab",pl=v==="place";$("labhost").hidden=!lab;$("plabhost").hidden=!pl;$("out").hidden=lab||pl;document.querySelector("header.top").hidden=lab||pl;syncTop();render();scrollTo(0,0)}
function render(){if(VIEW==="lab")return renderLab();if(VIEW==="place")return window.openPlacementLab&&openPlacementLab();if(VIEW==="lib")renderLib();else if(VIEW==="fav")renderFav();else if(VIEW==="bat")renderBat();else if(VIEW==="add")renderAdd();else renderMore()}
document.querySelector(".nav").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;if(b.dataset.v==="add"&&VIEW!=="add")ED=null;if(b.dataset.v==="lib")S.only=null;setView(b.dataset.v)};
$("secchips").onclick=e=>{const b=e.target.closest("[data-sec]");if(!b)return;S.sec=b.dataset.sec;S.only=null;syncTop();render();scrollTo(0,0)};
$("fbtn").onclick=filterSheet;
let qT=null;$("q").oninput=e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value.trim();S.only=null;render()},180)};

/* ---------- taps inside the list ---------- */
const BFAV2=BFAV;
$("out").addEventListener("click",e=>{const t=e.target;
  const cd=t.closest(".cd");if(cd&&EDIT&&cd.dataset.card&&VIEW!=="add"){e.preventDefault();picDialog(+cd.dataset.card,cd.dataset.form);return}
  const fv=t.closest("[data-fav]");if(fv){const k=fv.dataset.fav;if(FAVS[k])delete FAVS[k];else FAVS[k]=BYKEY[k]?{k,at:Date.now(),lib:true}:{k,at:Date.now(),...(BFAV2[k]||{})};lsSet("crd-favs",FAVS);
    document.querySelectorAll(`[data-fav="${k}"]`).forEach(b=>{const on=!!FAVS[k];b.setAttribute("aria-pressed",on);b.textContent=on?"♥":"♡"});if(VIEW==="fav"&&!FAVS[k]){const a=fv.closest(".dk");if(a)a.remove()}return}
  if(t.closest("[data-showall]")){S.only=null;render();return}
  const sd=t.closest("[data-side]");if(sd){BV.side=sd.dataset.side;BV.sort="";savePrefs();render();return}
  const art=t.closest(".dk");const d=art&&art.dataset.i!=null?D[+art.dataset.i]:null;
  const tb=t.closest("[data-tab]");if(tb&&d){d.active=+tb.dataset.tab;const open=!art.querySelector(".det").hidden;art.outerHTML=deckHTML(d);if(open){const a2=document.querySelector(`.dk[data-i="${d.i}"]`);const det=a2.querySelector(".det");det.innerHTML=detHTML(d);det.hidden=false}return}
  if(t.closest("[data-more]")&&d){const det=art.querySelector(".det");if(det.hidden){det.innerHTML=detHTML(d);det.hidden=false;t.closest("[data-more]").textContent="Hide details"}else{det.hidden=true;t.closest("[data-more]").textContent="Details"}return}
  const go=t.closest("[data-go]");if(go){S={...S,sec:"all",q:"",arch:"",spec:"",era:"",tower:"",only:+go.dataset.go};$("q").value="";if(VIEW!=="lib")setView("lib");else{syncTop();render();scrollTo(0,0)}return}
  const ar=t.closest("[data-arch]");if(ar){S={...S,arch:ar.dataset.arch,only:null,sec:"all"};syncTop();render();scrollTo(0,0);return}
  if(t.closest("[data-hide]")&&d){if(HIDDEN.has(d.key))HIDDEN.delete(d.key);else HIDDEN.add(d.key);lsSet("crd-hidden",[...HIDDEN]);if(HIDDEN.has(d.key)){art.remove();toast("Deck hidden. Unhide it from More.")}return}
  if(t.closest("[data-copy]")&&d){const v=d.variants[bestVar(d)];copyText(v.link);return}
  if(t.closest("[data-del]")&&d){const b=t.closest("[data-del]");if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to delete";return}USER=USER.filter(u=>u.key!==d.key);saveUser();render();toast("Deleted.");return}
  if(t.closest("[data-edit]")&&d&&d.userAdd){const u=d.userAdd,v=u.variants[0];ED={order:v.order.map(Number),roles:{...v.roles},tt:v.tt,title:u.title,arch:(u.arch||[]).join(", "),notes:u.notes||"",editing:u.key};setView("add");return}
  const sv=t.closest("[data-save-names]");if(sv){const j=JSON.parse(sv.dataset.saveNames);const order=j.names.map(n=>NAMEID[n]&&NAMEID[n][0]).filter(Boolean);const roles={};j.names.forEach(n=>{if(j.roles[n]&&NAMEID[n])roles[NAMEID[n][0]]=j.roles[n]});ED=null;startAdd({order,roles,tt:TTID[j.tower]||""},{title:bLabel(j.names,j.roles)});return}
});
function copyText(s){if(window.AndroidClip){AndroidClip.copy(s);toast("Link copied.");return}navigator.clipboard.writeText(s).then(()=>toast("Link copied."),()=>toast("Copying is blocked here."))}

/* ---------- shared from Clash Royale (Android share sheet) ---------- */
window.onSharedText=function(){let t="";try{t=window.AndroidShare?AndroidShare.take():""}catch(_){}if(!t)return;const p=parseDeckText(t);
  if(p&&p.order.length){startAdd(p);toast("Deck received. Check the Evo and Hero slots, then save.")}else toast("That share didn't contain a deck link.")};

/* ---------- boot ---------- */
(async()=>{rebuild();syncTop();render();await Promise.all([loadPics(),loadBattles()]);render();window.onSharedText()})();
</script>
