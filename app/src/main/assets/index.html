<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101a33">
<title>CR Decks</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#0e1730;--bg2:#16223f;--panel:#1a2849;--panel2:#22335c;--ink:#f1f4ff;--muted:#9eabcf;--line:rgba(255,255,255,.1);
  --gold:#f6c445;--gold-d:#b98a19;--elixir:#cf3fc6;--elixir-d:#851e80;--evo:#c04dff;--hero:#ffb21c;--champ:#36d1c1;
  --win:#4fd683;--loss:#ff6f6f;--troop:#3d74d0;--building:#8a7a62;--spell:#8a4fd2;
  --nav:64px;--safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 8px;border-bottom:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:1.25rem;font-weight:900;letter-spacing:.01em;color:var(--gold);flex:1}
.count{color:var(--muted);font-size:.85rem;font-weight:700}
.srow{display:flex;gap:8px;margin-top:8px}
.search{flex:1;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.ibtn{flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:0 12px;font-weight:800;font-size:.9rem;display:flex;align-items:center;gap:6px}
.ibtn .badge{background:var(--gold);color:#352500;border-radius:999px;padding:0 6px;font-size:.75rem}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -12px 0;padding:0 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:6px 12px;font-weight:800;font-size:.82rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--gold);color:#352500;border-color:var(--gold)}
main{padding:10px 10px calc(var(--nav) + var(--safe-b) + 20px)}
/* card gallery */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:0 2px}
.grow2{background:var(--panel,#1b2a52);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.gname{font-weight:800;display:flex;justify-content:space-between;gap:6px;font-size:.9rem}.gcost{color:var(--elixir,#d23cc9);font-weight:900}
.gforms{display:flex;gap:8px}
.gtile{position:relative;width:54px;aspect-ratio:3/4;border-radius:9px;border:2px solid var(--troop,#3f78d6);background:rgba(255,255,255,.04);padding:0;overflow:hidden;color:inherit;font:inherit}
.gtile.evo{border-color:var(--evo)}.gtile.hero{border-color:var(--hero)}.gtile.empty{border-style:dashed;opacity:.8}.gtile.gaddf{opacity:.45;border-style:dashed;background:none}
.gtile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gtile .plus{position:absolute;inset:0;display:grid;place-items:center;font-size:1.5rem;color:var(--muted)}
.gtile .gl{position:absolute;left:0;right:0;bottom:0;font-size:.6rem;font-weight:800;background:rgba(0,0,0,.55);color:#fff;text-align:center;padding:1px 0}
#labhost{display:block;padding:8px 6px calc(var(--nav) + var(--safe-b) + 16px)}
.sec{margin:16px 4px 6px;font-weight:900;font-size:1.02rem;color:var(--gold)}
.secn{margin:0 4px 8px;color:var(--muted);font-size:.8rem}
.dk{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;content-visibility:auto;contain-intrinsic-size:auto 330px}
.dk.main{border-color:#e0245e}
.dh{display:flex;align-items:flex-start;gap:8px}
.dt{flex:1;min-width:0}
.dt h3{margin:0;font-size:1rem;font-weight:900;line-height:1.2;overflow-wrap:anywhere}
.dt .sub{color:var(--muted);font-size:.76rem;font-weight:700;margin-top:2px}
.elx{flex:none;display:flex;align-items:center;gap:4px;background:var(--bg2);border-radius:8px;padding:3px 7px;font-weight:900;font-size:.82rem}
.drop{width:9px;height:12px;background:var(--elixir);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:inline-block}
.fav{flex:none;background:var(--bg2);border:1px solid var(--line);border-radius:10px;width:36px;height:30px;font-size:1.05rem;line-height:1;color:var(--muted)}
.fav[aria-pressed="true"]{color:#ff4d6d;border-color:#ff4d6d}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:.7rem;font-weight:900;padding:2px 7px;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.tag.main{background:#e0245e;border-color:#e0245e}
.tag.mine{background:var(--gold);color:#352500;border-color:var(--gold)}
.tag.slot{background:#2f6fde;border-color:#2f6fde}.tag.war{background:#1f9d57;border-color:#1f9d57}
.tag.user{border-color:var(--champ);color:var(--champ)}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin:8px -10px 0;padding:0 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;max-width:220px;text-align:left;border:1px solid var(--line);background:transparent;border-radius:9px;padding:4px 8px;font-size:.72rem;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab small{display:block;font-weight:700;opacity:.8}
.tab[aria-selected="true"]{background:var(--bg2);color:var(--ink);border-color:var(--gold)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.cd{position:relative;aspect-ratio:5/6;border-radius:9px;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;text-align:center;font-weight:900;font-size:.66rem;line-height:1.1;padding:3px;color:#fff}
.cd.troop{background:linear-gradient(160deg,#5b93ec,var(--troop))}
.cd.building{background:linear-gradient(160deg,#a8987c,var(--building))}
.cd.spell{background:linear-gradient(160deg,#a878ea,var(--spell))}
.cd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cd.pic .nm{display:none}
.cd .nm{position:relative;text-shadow:0 1px 2px #000}
.cd .cost{position:absolute;top:2px;left:2px;z-index:2;width:18px;height:21px;background:var(--elixir);border:1.5px solid var(--elixir-d);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:grid;place-items:center;font-size:.68rem;font-weight:900}
.cd .rl{position:absolute;top:2px;right:2px;z-index:2;font-size:.55rem;font-weight:900;padding:1px 4px;border-radius:4px;color:#1a1030}
.cd.evo{box-shadow:inset 0 0 0 2px var(--evo)}.cd.hero{box-shadow:inset 0 0 0 2px var(--hero)}.cd.champ{box-shadow:inset 0 0 0 2px var(--champ)}
.rl.evo{background:var(--evo);color:#fff}.rl.hero{background:var(--hero)}.rl.champ{background:var(--champ)}
.cd.hit{outline:2px solid var(--gold);outline-offset:1px}
body.editpics .cd{outline:2px dashed var(--gold);outline-offset:-2px}
.act{display:flex;gap:8px;margin-top:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg2);border-radius:11px;padding:9px 12px;font-weight:800;font-size:.86rem;text-decoration:none;color:var(--ink);text-align:center}
.btn.gold{background:var(--gold);color:#352500;border-color:var(--gold)}
.btn.grow{flex:1}
.btn.small{padding:6px 10px;font-size:.8rem}
.btn.danger{color:var(--loss)}
.rec{font-weight:900;font-size:.85rem}.w{color:var(--win)}.l{color:var(--loss)}
.det{margin-top:8px;font-size:.8rem;color:var(--muted);display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line);padding-top:8px}
.det b{color:var(--ink)}
.det .row{display:flex;flex-wrap:wrap;gap:6px}
.empty{color:var(--muted);text-align:center;padding:40px 16px}
.sentinel{height:1px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg2);border-top:1px solid var(--line);padding-bottom:var(--safe-b);height:calc(var(--nav) + var(--safe-b))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;font-weight:800;color:var(--muted)}
.nav button span{font-size:1.25rem;line-height:1}
.nav button[aria-current="page"]{color:var(--gold)}
.nav .add span{background:var(--gold);color:#352500;border-radius:12px;width:40px;height:28px;display:grid;place-items:center;font-size:1.3rem;font-weight:900}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88vh;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;padding:14px 14px calc(16px + var(--safe-b));display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:1.1rem;font-weight:900}
.lab{font-size:.75rem;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.fld{display:flex;flex-direction:column;gap:5px}
select,.inp,textarea{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;font-size:16px}
textarea{min-height:76px;resize:vertical}
.wrapchips{display:flex;flex-wrap:wrap;gap:6px}
.sbtns{display:flex;gap:8px}.duset{contain-intrinsic-size:auto 640px}.dud{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}.dud.locked{border-top-color:var(--gold)}.dudh{display:flex;align-items:center;gap:8px}.dudt{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:.86rem}.dudt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.cards.c8{grid-template-columns:repeat(8,1fr);gap:3px;margin-top:6px}.c8 .cd{border-radius:6px;padding:0}.c8 .cd .nm{display:none}.c8 .cd .rl{display:none}.c8 .cd .cost{width:14px;height:16px;font-size:.58rem;top:1px;left:1px}.duda{display:flex;gap:8px;margin-top:7px;align-items:center}.chip small{opacity:.7;font-weight:700}
.page{display:flex;flex-direction:column;gap:12px;padding:4px}
.card2{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card2 h2{margin:0;font-size:1.02rem;font-weight:900}
.card2 p{margin:0;color:var(--muted);font-size:.86rem}
.msg{font-size:.85rem;font-weight:700;color:var(--ink)}
.msg.err{color:var(--loss)}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:4px 4px 10px}
.num{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.num b{display:block;font-size:1.3rem;font-weight:900;color:var(--gold)}
.num span{font-size:.75rem;color:var(--muted);font-weight:700}
.bar2{display:flex;gap:8px;margin:0 4px 8px}
.bar2 select{flex:1;min-width:0;padding:8px 10px;font-size:.9rem}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:0 4px 8px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px;font-weight:900;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#352500}
.pickgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-height:46vh;overflow-y:auto}
.pickgrid .cd{font-size:.58rem;border:0}
.pickgrid .cd.on{outline:3px solid var(--gold);outline-offset:-3px;opacity:.55}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.slots .cd{border:0}
.slots .cd.emptyslot{background:var(--bg2);border:1px dashed var(--line);color:var(--muted)}
.hint{font-size:.78rem;color:var(--muted)}
.unk{display:grid;grid-template-columns:1fr 70px;gap:6px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + var(--safe-b) + 14px);z-index:60;background:var(--ink);color:#0e1730;font-weight:800;font-size:.86rem;border-radius:12px;padding:10px 14px;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
label.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center}
.only{display:flex;align-items:center;gap:8px;margin:0 4px 8px}
</style>
</head>
<body>
<header class="top">
  <div class="trow"><h1 id="ttl">My decks</h1><span class="count" id="count"></span></div>
  <div class="srow" id="srow"><input type="search" class="search" id="q" placeholder="Search a card or deck" autocomplete="off" aria-label="Search"><button class="ibtn" id="fbtn" type="button">Filters <span class="badge" id="fbadge" hidden></span></button></div>
  <div class="chips" id="secchips" role="group" aria-label="Section"></div>
</header>
<main id="out"></main>
<div id="labhost" hidden></div>
<nav class="nav" aria-label="Sections">
  <button type="button" data-v="lib" aria-current="page"><span>🃏</span>Decks</button>
  <button type="button" data-v="fav"><span>♥</span>Favorites</button>
  <button type="button" data-v="bat"><span>⚔</span>Battles</button>
  <button type="button" data-v="lab"><span>💧</span>Lab</button>
  <button type="button" data-v="add" class="add"><span>+</span>Add</button>
  <button type="button" data-v="more"><span>⋯</span>More</button>
</nav>
<div id="sheet" class="sheet-bg" hidden><div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<input type="file" id="picfile" accept="image/*" class="vh" aria-hidden="true" tabindex="-1">
<div id="toast" class="toast" hidden role="status"></div>
<script src="data.js"></script>
<script>
/* ---------- Elixir Lab (runs inside its own shadow root, so its styles never touch the rest of the app) ---------- */
function ELAB_START(ROOT,HOST,RAW,PIC,ACTIVE,ON){
/* ---------- card knowledge ---------- */
const SPELLS=new Set(['Arrows','Barbarian Barrel','Clone','Earthquake','Fireball','Freeze','Giant Snowball','Goblin Barrel','Goblin Curse','Graveyard','Lightning','Mirror','Poison','Rage','Rocket','Royal Delivery','The Log','Tornado','Vines','Void','Zap']);
const BLDG=new Set(['Barbarian Hut','Bomb Tower','Cannon','Elixir Collector','Furnace','Goblin Cage','Goblin Drill','Goblin Hut','Inferno Tower','Mortar','Tesla','Tombstone','X-Bow']);
const CHAMP=new Set(RAW.champ);
// Champion ability elixir costs (gamingonphone champion guide; RoyaleAPI for Goblinstein; esports.net for Boss Bandit)
const CHAMP_AB={'Archer Queen':1,'Golden Knight':1,'Little Prince':3,'Mighty Miner':1,'Monk':1,'Skeleton King':2,'Goblinstein':2,'Boss Bandit':1};
// Hero ability elixir costs, one use per deployment since the Aug 2026 update (TrophyCoach hero encyclopedia)
const HERO_AB={'Knight':2,'Giant':2,'Mini P.E.K.K.A':1,'Musketeer':3,'Wizard':2,'Ice Golem':2,'Goblins':1,'Mega Minion':2,'Barbarian Barrel':1,'Magic Archer':2,'Balloon':2,'Dark Prince':3,'Bowler':2,'Tombstone':5,'Valkyrie':3,'Berserker':3,'Ice Wizard':2,'Electro Wizard':2};
// Evolution cycles (gamingonphone evolution list). Others default to 2 and are marked unverified; editable in Settings.
const EVO_KNOWN={'Barbarians':1,'Firecracker':2,'Skeletons':2,'Royal Giant':1,'Mortar':2,'Knight':2,'Royal Recruits':1,'Bats':2,'Archers':2,'Ice Spirit':3,'Valkyrie':2,'Bomber':1,'Wall Breakers':2,'Tesla':2,'Zap':2,'Battle Ram':2,'Wizard':1,'Goblin Barrel':2};
const PUMP={rate:8.5,max:8,life:70}; // clasher.us Elixir Collector stats
const ABBR={'Hog Rider':'HOG','The Log':'LOG','Three Musketeers':'3M','Electro Giant':'EG','Electro Wizard':'EW','Electro Dragon':'ED','Electro Spirit':'ES','Elixir Collector':'PMP','Elixir Golem':'EGL','Elite Barbarians':'EB','Mini P.E.K.K.A':'MP','P.E.K.K.A':'PK','Mega Knight':'MK','Mega Minion':'MM','Minion Horde':'HRD','Skeleton Army':'SKA','Skeleton Barrel':'SKB','Skeleton Dragons':'SKD','Skeleton King':'SK','Skeletons':'SKE','Goblin Barrel':'GBR','Goblin Gang':'GG','Goblin Giant':'GGI','Goblin Hut':'GHT','Goblin Cage':'CAG','Goblin Drill':'DRL','Goblin Curse':'CRS','Goblin Machine':'GMC','Goblin Demolisher':'DEM','Goblinstein':'GST','Goblins':'GOB','Giant Skeleton':'GSK','Giant Snowball':'SNW','Giant':'GIA','Golden Knight':'GK','Golem':'GOL','Royal Giant':'RG','Royal Hogs':'RH','Royal Recruits':'RR','Royal Ghost':'GHO','Royal Delivery':'DLV','Ice Spirit':'ICS','Ice Golem':'IG','Ice Wizard':'IW','Fire Spirit':'FS','Heal Spirit':'HS','Inferno Tower':'INF','Inferno Dragon':'ID','Lava Hound':'LH','Little Prince':'LP','Lumberjack':'LJ','Magic Archer':'MA','Mighty Miner':'MMi','Mother Witch':'MW','Night Witch':'NW','Archer Queen':'AQ','Baby Dragon':'BD','Barbarian Barrel':'BBL','Barbarian Hut':'BHT','Battle Ram':'RAM','Battle Healer':'BH','Bomb Tower':'BT','Boss Bandit':'BB','Cannon Cart':'CC','Dark Prince':'DP','Dart Goblin':'DG','Flying Machine':'FM','Wall Breakers':'WB','Spear Goblins':'SPG','Spirit Empress':'SE','Suspicious Bush':'BSH','Rune Giant':'RNG','Minion Giant':'MGI','Ram Rider':'RR2','X-Bow':'XB','Earthquake':'EQ','Lightning':'LTN','Fireball':'FB','Tornado':'TOR','Poison':'PSN','Rocket':'RKT','Freeze':'FRZ','Graveyard':'GY','Mirror':'MIR','Arrows':'ARR','Zap':'ZAP','Rage':'RGE','Clone':'CLN','Vines':'VIN','Void':'VOD','Tombstone':'TMB','Executioner':'EXE','Firecracker':'FC','Fisherman':'FSH','Musketeer':'MSK','Valkyrie':'VAL','Berserker':'BRS','Princess':'PRN','Bandit':'BDT','Hunter':'HNT','Phoenix':'PHX','Zappies':'ZPS','Rascals':'RAS','Guards':'GRD','Witch':'WCH','Wizard':'WIZ','Bowler':'BWL','Sparky':'SPK','Tesla':'TES','Mortar':'MOR','Furnace':'FUR','Cannon':'CAN','Knight':'KNT','Archers':'ARC','Bats':'BAT','Minions':'MIN','Bomber':'BMB','Barbarians':'BAR','Balloon':'BLN','Miner':'MNR','Monk':'MNK','Prince':'PRC','Ronin':'RON','Lumberjack ':'LJ'};
const WINCON=['Hog Rider','Golem','Electro Giant','Royal Giant','Giant','Goblin Giant','Lava Hound','Balloon','X-Bow','Mortar','Graveyard','Goblin Barrel','Royal Hogs','Three Musketeers','Ram Rider','Battle Ram','Miner','Goblin Drill','Wall Breakers','Mega Knight','P.E.K.K.A','Elixir Golem','Giant Skeleton','Sparky','Skeleton Barrel','Rune Giant','Minion Giant','Goblinstein','Royal Recruits','Elite Barbarians','Skeleton Dragons','Prince'];
const cost=n=>RAW.cards[n]?RAW.cards[n][1]:3;
const ctype=n=>CHAMP.has(n)?'champ':SPELLS.has(n)?'spell':BLDG.has(n)?'bldg':'troop';
const abbr=n=>ABBR[n]||n.replace(/[^A-Za-z ]/g,'').split(' ').map(w=>w[0]).join('').slice(0,3).toUpperCase()||n.slice(0,3).toUpperCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmtT=s=>{s=Math.max(0,s);const m=Math.floor(s/60),x=Math.floor(s%60);return m+':'+String(x).padStart(2,'0')};

/* ---------- storage (per-device convenience) ---------- */
const store={get(k,d){try{const v=localStorage.getItem('elab-'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('elab-'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- settings ---------- */
const DEFAULTS={
  oppPool:['meta','faced'], oppDeck:-1, myDeck:-1, youPlay:true, autoMe:false,
  speed:1, startElixir:5, startAt:0, overtime:'off', style:'mixed', react:true,
  qEvery:'plays', qPlays:3, qSecs:15, timer:10, tol:0,
  qTypes:{elixir:true,diff:true,hand:true,cycle:true,evo:true,inhand:true,ago:true,next:true},
  showLog:true, memory:false, revealDeck:true, showOppName:false, showOppElixir:false, showClock:true, showPhase:true, showPump:true,
  evoStartCharged:false, pumpLife:'random', abilities:true,
  quizN:15, quizTimer:15, quizTypes:{cost:true,ability:true,trade:true,counter:true,placement:true,deck:true,math:true,evo:true},
  evoOverride:{}
};
let S=Object.assign({},DEFAULTS,store.get('settings',{}));
S.qTypes=Object.assign({},DEFAULTS.qTypes,S.qTypes||{});S.quizTypes=Object.assign({},DEFAULTS.quizTypes,S.quizTypes||{});S.evoOverride=S.evoOverride||{};
const saveS=()=>{S.myDeckK=S.myDeck>=0&&DECKS[S.myDeck]?DECKS[S.myDeck].k:null;S.oppDeckK=S.oppDeck>=0&&DECKS[S.oppDeck]?DECKS[S.oppDeck].k:null;store.set('settings',S)};
const evoCycles=n=>S.evoOverride[n]!=null?S.evoOverride[n]:(EVO_KNOWN[n]??2);

{const fi=k=>k?DECKS.findIndex(d=>d.k===k):-1;S.myDeck=fi(S.myDeckK);S.oppDeck=fi(S.oppDeckK);}

/* ---------- simulation ---------- */
function rateAt(t){ if(t<120)return 1/2.8; if(t<180)return 2/2.8; if(t<240)return 2/2.8; return 3/2.8 }
function phaseAt(t){return t<120?1:t<240?2:3}
function endTime(){let e=S.overtime==='off'?180:S.overtime==='on'?300:(Math.random()<.5?180:300);if(S.startAt>=e-30)e=Math.min(300,Math.max(e,S.startAt+60));if(S.startAt>=180)e=300;return e}

function makePlayer(deck,name){
  const order=shuffle(deck.c);
  const p={name,deck,roles:deck.r||{},elixir:S.startElixir,hand:order.slice(0,4),queue:order.slice(4),leaked:0,plays:[],pumps:[],evo:{},out:{},seen:new Set(),abilityTimers:[],lastCard:null,leakRun:0,ready:[],react:null,pushT:0};
  for(const n of deck.c)if(p.roles[n]==='evo')p.evo[n]=S.evoStartCharged?evoCycles(n):0;
  return p;
}
function canAfford(p,n){return p.elixir+1e-9>=playCost(p,n)}
function playCost(p,n){if(n==='Mirror')return p.lastCard&&p.lastCard!=='Mirror'?Math.min(10,cost(p.lastCard)+1):99;return cost(n)}

const G={}; // match state
function newMatch(){
  const pool=poolDecks();
  const od=S.oppDeck>=0&&DECKS[S.oppDeck]?DECKS[S.oppDeck]:pick(pool);
  const md=DECKS[S.myDeck>=0?S.myDeck:myDefault()];
  Object.assign(G,{t:S.startAt,end:endTime(),running:false,over:false,events:[],questions:[],samples:[],
    me:makePlayer(md,'You'),op:makePlayer(od,'Opponent'),nextOp:S.startAt+rnd(1.5,4),nextMe:S.startAt+rnd(1,3),
    style:S.style==='mixed'?pick(['patient','aggressive','cycle']):S.style,sinceQ:0,lastBig:null,memHide:false,nextQAt:S.startAt+S.qSecs,lastFrame:0,qOpen:false,sel:null,stats:{}});
  G.op.elixir=S.startElixir;G.me.elixir=S.startElixir;
  if(S.revealDeck)for(const n of od.c)G.op.seen.add(n);
}
function tickPlayer(p,dt){
  const r=rateAt(G.t)*dt;let e=p.elixir+r;
  for(const pm of p.pumps){ if(!pm.alive)continue;
    pm.timer+=dt; while(pm.timer>=PUMP.rate&&pm.made<PUMP.max&&pm.age<pm.life){pm.timer-=PUMP.rate;pm.made++;e+=1;logPump(p,pm)}
    pm.age+=dt; if(pm.age>=pm.life||pm.made>=PUMP.max){pm.alive=false}
  }
  if(e>10){p.leaked+=e-10;p.leakRun+=e-10;e=10}
  else if(p.leakRun>0){if(p.leakRun>=0.3)G.events.push({t:G.t,who:p===G.op?'op':'me',leak:p.leakRun});p.leakRun=0}
  p.elixir=e;
}
function logPump(p,pm){G.events.push({t:G.t,who:p===G.op?'op':'me',pump:1,elixirAfter:Math.min(10,p.elixir+1)})}
function doPlay(p,n,opts={}){
  const c=playCost(p,n);if(p.elixir+1e-9<c)return false;
  const before=p.elixir;p.elixir-=c;
  const idx=p.hand.indexOf(n);if(idx<0)return false;
  p.hand.splice(idx,1);
  let evolved=false;
  if(p.roles[n]==='evo'){const N=evoCycles(n);if(p.evo[n]>=N){evolved=true;p.evo[n]=0}else p.evo[n]++}
  const role=p.roles[n]||(CHAMP.has(n)?'champ':null);
  if(CHAMP.has(n)){p.out[n]=G.t+rnd(9,26)} else p.queue.push(n);
  if(p.queue.length)p.hand.push(p.queue.shift());
  p.lastCard=n;p.seen.add(n);
  const ev={t:G.t,who:p===G.op?'op':'me',card:n,cost:c,before,after:p.elixir,evolved,role};
  G.events.push(ev);p.plays.push(ev);
  if(n==='Elixir Collector'){const life=S.pumpLife==='full'?PUMP.life:rnd(25,PUMP.life);p.pumps.push({t:G.t,timer:0,made:0,age:0,life,alive:true})}
  if(S.abilities){
    const ab=role==='hero'?HERO_AB[n]:CHAMP.has(n)?CHAMP_AB[n]:null;
    const aiSide=p===G.op||S.autoMe||!S.youPlay;
    if(ab&&aiSide){p.abilityTimers.push({at:G.t+rnd(2,7),card:n,cost:ab,uses:CHAMP.has(n)?(Math.random()<.35?2:1):1,prob:.75})}
    else if(ab){p.ready.push({card:n,cost:ab,until:CHAMP.has(n)?null:G.t+10,champ:CHAMP.has(n)})}
  }
  if(p===G.op){G.sinceQ++}
  aiOnPlay(p,n);
  return ev;
}
function champsReturn(p){for(const n in p.out){if(G.t>=p.out[n]){delete p.out[n];p.queue.push(n);if(p.hand.length<4&&p.queue.length)p.hand.push(p.queue.shift())}}}
function useAbilities(p){
  for(const a of p.abilityTimers){ if(a.done||G.t<a.at)continue;
    const alive=CHAMP.has(a.card)?(a.card in p.out):true; if(!alive){a.done=true;continue}
    if(Math.random()>a.prob){a.done=true;continue}
    if(p.elixir+1e-9>=a.cost){const before=p.elixir;p.elixir-=a.cost;const ev={t:G.t,who:p===G.op?'op':'me',card:a.card,cost:a.cost,before,after:p.elixir,ability:true};G.events.push(ev);p.plays.push(ev);a.uses--;
      if(a.uses>0){a.at=G.t+rnd(10,16)}else a.done=true}
    else a.at=G.t+1.5;
  }
}
/* Realistic play model: pushes built around the win condition, defence priced to the threat, cycling at full elixir. */
const isThreat=n=>!SPELLS.has(n)||n==='Goblin Barrel'||n==='Graveyard';
function otherOf(p){return p===G.op?G.me:G.op}
function aiControlled(p){return p===G.op||!S.youPlay||S.autoMe}
function aiOnPlay(p,n){
  // the other side answers a threat with a card priced close to it
  const o=otherOf(p);if(!aiControlled(o))return;
  if(p===G.me&&!S.react&&o===G.op)return;
  if(!isThreat(n))return;
  if(Math.random()<.85)o.react={by:G.t+rnd(.7,2.2),limit:cost(n)+1,target:Math.max(1,cost(n)-rnd(0,1.6)),giveUp:G.t+5};
}
function pickBy(p,list,score){let best=null,bs=-1e9;for(const n of list){const v=score(n)+Math.random()*.6;if(v>bs){bs=v;best=n}}return best}
function affordable(p){return p.hand.filter(n=>canAfford(p,n)&&playCost(p,n)<99)}
function aiStep(p,isOpp){
  if(!aiControlled(p))return;
  const key=isOpp?'nextOp':'nextMe';
  if(G.t<G[key])return;
  const dbl=rateAt(G.t)>1/2.8+1e-9;const style=isOpp?G.style:'mixed';
  const aff=affordable(p);
  // 1. defend a threat on the board
  if(p.react){
    if(G.t>=p.react.by){
      const c=aff.filter(n=>n!=='Elixir Collector'&&playCost(p,n)<=p.react.limit);
      if(c.length){const n=pickBy(p,c,x=>-Math.abs(playCost(p,x)-p.react.target)-(WINCON.includes(x)?2:0));p.react=null;doPlay(p,n);G[key]=G.t+rnd(.8,2);afterPlay(isOpp?'op':'me');
        if(Math.random()<.35)p.pushT=G.t+rnd(1.5,4); return}
      if(G.t>p.react.giveUp)p.react=null;
    }
    G[key]=G.t+.3;return;
  }
  // 2. support a push already under way
  if(p.supportBy&&G.t>=p.supportBy){p.supportBy=0;
    const c=aff.filter(n=>!WINCON.includes(n)&&n!=='Elixir Collector');
    if(c.length&&Math.random()<.75){const n=pick(c);doPlay(p,n);G[key]=G.t+rnd(1,2.5);afterPlay(isOpp?'op':'me');return}}
  // 3. push with the win condition
  const th=p._th??(p._th=style==='patient'?rnd(8,10.4):style==='aggressive'?rnd(5,7.5):rnd(6.5,9.5))-(dbl?1.5:0);
  const wc=aff.filter(n=>WINCON.includes(n));
  if(wc.length&&(p.elixir>=th||(p.pushT&&G.t>=p.pushT&&p.elixir>=cost(wc[0])+1))){
    const n=pick(wc);p.pushT=0;p._th=null;doPlay(p,n);if(Math.random()<.6)p.supportBy=G.t+rnd(.8,2.5);G[key]=G.t+rnd(1,2.5);afterPlay(isOpp?'op':'me');return}
  // 4. pump when rich, or cycle at full elixir instead of leaking
  if(p.elixir>=9.3){
    const pm=aff.find(n=>n==='Elixir Collector');
    if(pm&&Math.random()<.5){doPlay(p,pm);G[key]=G.t+rnd(1,2);afterPlay(isOpp?'op':'me');return}
    if(Math.random()<(style==='patient'?.35:.7)){const n=pickBy(p,aff.filter(x=>!WINCON.includes(x)||aff.length<2),x=>-playCost(p,x));if(n){doPlay(p,n);G[key]=G.t+rnd(1,2.5);afterPlay(isOpp?'op':'me');return}}
  }
  // 5. occasional cheap cycle play mid-elixir
  if(style==='cycle'&&p.elixir>=5&&Math.random()<.15){const n=pickBy(p,aff.filter(x=>!WINCON.includes(x)),x=>-playCost(p,x));if(n&&playCost(p,n)<=2){doPlay(p,n);G[key]=G.t+rnd(1.5,3);afterPlay(isOpp?'op':'me');return}}
  G[key]=G.t+rnd(.3,.8);
}
function reactTo(){}
function afterPlay(who){
  render.feed();
  if(who==='me')reactTo();
  if(who==='op'&&S.qEvery==='plays'&&G.sinceQ>=S.qPlays){G.sinceQ=0;setTimeout(()=>ask(),1300)}
}
function loop(ts){
  if(!G.running){G.lastFrame=0;return}
  if(!G.lastFrame)G.lastFrame=ts;
  let dt=Math.min(.1,(ts-G.lastFrame)/1000)*S.speed;G.lastFrame=ts;
  if(!G.qOpen){
    const steps=Math.ceil(dt/.05);const h=dt/steps;
    for(let k=0;k<steps;k++){
      G.t+=h;tickPlayer(G.op,h);tickPlayer(G.me,h);champsReturn(G.op);champsReturn(G.me);useAbilities(G.op);if(aiControlled(G.me))useAbilities(G.me);G.me.ready=G.me.ready.filter(a=>a.champ?(a.card in G.me.out):G.t<a.until);
      if(Math.floor(G.t*2)!==Math.floor((G.t-h)*2))G.samples.push({t:G.t,op:G.op.elixir,me:G.me.elixir});
      aiStep(G.op,true);
      aiStep(G.me,false);
      if(S.qEvery==='time'&&G.t>=G.nextQAt){G.nextQAt=G.t+S.qSecs*rnd(.7,1.3);ask();break}
      if(G.t>=G.end){finish();return}
      if(G.qOpen)break;
    }
  }
  render.hud();
  requestAnimationFrame(loop);
}
function start(){const h=$('.howd');if(h)h.open=false;G.running=true;G.lastFrame=0;requestAnimationFrame(loop);render.controls()}
function pause(){G.running=false;render.controls()}

/* ---------- questions in match ---------- */
function ledger(){
  // running elixir lead from THEIR side, the way players count it: spend more = fall behind
  let lead=0;const rows=[];
  for(const e of G.events){
    if(e.card){const d=e.who==='op'?-e.cost:e.cost;lead+=d;rows.push({e,lead})}
    else if(e.pump){const d=e.who==='op'?1:-1;lead+=d;rows.push({e,lead})}
    else if(e.leak){const d=e.who==='op'?-e.leak:e.leak;lead+=d;rows.push({e,lead})}
  }
  return {lead,rows};
}
function leadTxt(n){n=Math.round(n);return n===0?'even':n>0?`they're up ${n}`:`you're up ${-n}`}
function explainElixir(p){
  const op=G.op,me=G.me;
  if(!S.youPlay){
    const pl=op.plays;const spent=pl.reduce((a,e)=>a+e.cost,0);const lp=pl[pl.length-1];
    return lp?`Their last play was <b>${esc(lp.card)}${lp.ability?' ability':''}</b> (${lp.cost}). Exactly ${op.elixir.toFixed(1)} now.`:`No plays yet, so they are still on their starting ${S.startElixir}.`;
  }
  const {rows}=ledger();
  const recent=rows.slice(-5).map(r=>{const e=r.e;const who=e.who==='op'?'They':'You';
    const what=e.pump?`${e.who==='op'?'Their':'Your'} pump +1`:e.leak?`${who} sat at 10 and wasted ${e.leak.toFixed(1)}`:`${who} played ${esc(e.card)}${e.ability?' ability':''} (${e.cost})`;
    return `<li>${what} → <b>${leadTxt(r.lead)}</b></li>`}).join('');
  // leaks shift the balance too
  const leakNote=(me.leakRun>0.3||op.leakRun>0.3)?'<br>Someone is sitting at 10 right now, leaking.':'';
  const realLead=op.elixir-me.elixir;
  return `<ul style="margin:4px 0 6px;padding-left:18px">${recent}</ul>Your bar shows <b>${Math.floor(me.elixir)}</b>; ${leadTxt(realLead)}, so they have <b>${Math.floor(op.elixir+1e-9)}</b>.${leakNote}${op.elixir>=9.99?'<br>They are sitting at 10 and leaking.':''}`;
}
function buildQ(depth=0){
  if(depth>6)return null;
  const types=Object.keys(S.qTypes).filter(k=>S.qTypes[k]);
  const op=G.op;const can=[];
  if(types.includes('elixir'))can.push('elixir','elixir');
  if(types.includes('diff')&&S.youPlay)can.push('diff');
  const playedCount=op.plays.filter(e=>!e.ability).length;
  if(types.includes('hand')&&playedCount>=4&&op.hand.every(n=>op.seen.has(n)))can.push('hand');
  if(types.includes('cycle')&&playedCount>=1)can.push('cycle');
  const evoCards=Object.keys(op.evo).filter(n=>op.seen.has(n));
  if(types.includes('evo')&&evoCards.length)can.push('evo');
  const seen=[...op.seen].filter(n=>op.deck.c.includes(n));
  if(types.includes('inhand')&&playedCount>=3&&seen.length>=3)can.push('inhand','inhand');
  if(types.includes('ago')&&playedCount>=4)can.push('ago');
  if(types.includes('next')&&playedCount>=5&&op.queue.length&&op.plays.filter(e=>!e.ability).slice(-4).some(e=>e.card===op.queue[0]))can.push('next');
  if(!can.length)return null;
  const k=pick(can);
  const plays=op.plays.filter(e=>!e.ability);
  if(k==='inhand'){const n=pick(seen.filter(x=>!CHAMP.has(x)||!(x in op.out)));const yes=op.hand.includes(n);
    return {k,label:'Card tracking',prompt:`Is <b>${esc(n)}</b> in their hand right now?`,kind:'mc',opts:['Yes','No'],answer:yes?'Yes':'No',why:()=>{const i=plays.map(e=>e.card).lastIndexOf(n);const since=i<0?null:plays.length-1-i;
      return i<0?`They haven't played ${esc(n)} yet${op.hand.includes(n)?', and it is in their hand':', and it is still in their queue'}.`:`They last played ${esc(n)} ${since===0?'just now':since+' play'+(since>1?'s':'')+' ago'}. A card comes back to hand 4 plays after it's used${since>=4?', so it is back':', so it is not back yet'}.`}}}
  if(k==='ago'){const back=pick([2,3,4].filter(b=>b<=plays.length));const n=plays[plays.length-back].card;
    const opts=shuffle([n,...shuffle([...new Set(plays.map(e=>e.card))].filter(x=>x!==n)).slice(0,3)]);
    return {k,label:'Rotation memory',prompt:`Which card did they play ${back} plays ago? (the last one counts as 1)`,kind:'mc',opts,answer:n,why:()=>`Their last ${back} plays, newest first: ${plays.slice(-back).reverse().map(e=>'<b>'+esc(e.card)+'</b>').join(', ')}.`}}
  if(k==='next'){const last4=plays.slice(-4).map(e=>e.card);const n=op.queue[0];
    return {k,label:'Next card back',prompt:'Which of their recent cards comes back to their hand next?',kind:'mc',opts:shuffle([...new Set(last4)]),answer:n,why:()=>`Cards return in the order they were played. Of their last four (${last4.map(esc).join(', ')}), the oldest is <b>${esc(n)}</b>, so it is next.`}}
  if(k==='elixir'){const v=Math.floor(op.elixir+1e-9);return {k,label:'Opponent elixir',prompt:'How much elixir does your opponent have right now?',kind:'pad',answer:v,why:()=>explainElixir(op),exact:op.elixir}}
  if(k==='diff'){const v=Math.floor(G.me.elixir+1e-9)-Math.floor(op.elixir+1e-9);
    return {k,label:'Elixir lead',prompt:'Who is up on elixir, and by how much?',kind:'diff',answer:v,why:()=>explainElixir(op)}}
  if(k==='hand'){const real=new Set(op.hand);
    const opts=[...new Set(op.deck.c)].filter(n=>op.seen.has(n));
    return {k,label:'Card tracking',prompt:'Tap the 4 cards in their hand right now.',kind:'multi',opts,answer:[...real],why:()=>{const last4=op.plays.filter(e=>!e.ability).slice(-4).map(e=>e.card);return `Their last four plays were ${last4.map(c=>'<b>'+esc(c)+'</b>').join(', ')}. Those are at the back of the queue, so the other four are in hand${Object.keys(op.out).length?' (a champion on the field is out of the rotation)':''}.`}}}
  if(k==='cycle'){const pl=op.plays.filter(e=>!e.ability);const recent=pl.slice(-4).map(e=>e.card);const target=pick(recent.filter(n=>!CHAMP.has(n)))||recent[recent.length-1];
    if(CHAMP.has(target)||!op.queue.includes(target)&&!op.hand.includes(target))return buildQ(depth+1);
    const inHand=op.hand.includes(target);const pos=op.queue.indexOf(target); // plays needed before it reaches hand = pos+1
    const v=inHand?0:pos+1;
    return {k,label:'Cycle',prompt:`How many more cards must they play before <b>${esc(target)}</b> is back in their hand? (0 = it already is)`,kind:'pad',answer:v,max:4,why:()=>`Each play pulls the next card from the queue into the hand. ${esc(target)} is ${inHand?'already in hand':`number ${pos+1} in the queue`}. Played since it: ${pl.slice(pl.map(e=>e.card).lastIndexOf(target)+1).map(e=>esc(e.card)).join(', ')||'nothing yet'}.`}}
  if(k==='evo'){const n=pick(evoCards);const N=evoCycles(n);const c=op.evo[n];const left=Math.max(0,N-c);
    return {k,label:'Evolution watch',prompt:`How many more times must they play <b>${esc(n)}</b> before it comes out evolved? (0 = the next one is evolved)`,kind:'pad',answer:left,max:4,why:()=>`Evo ${esc(n)} needs ${N} cycle${N>1?'s':''} (${S.evoOverride[n]!=null?'your setting':EVO_KNOWN[n]!=null?'listed value':'default, unverified'}). Plays counted since its last evolution: ${c}.`}}
}
let qTimer=null;
function ask(){
  if(G.qOpen||G.over)return;
  const q=buildQ();if(!q)return;
  G.qOpen=true;q.t=G.t;q.started=performance.now();
  render.question(q);
}
function answer(q,given){
  clearInterval(qTimer);
  let ok,err=0;
  if(q.kind==='pad'||q.kind==='diff'){ok=given!=null&&Math.abs(given-q.answer)<=S.tol;err=given==null?null:Math.abs(given-q.answer)}
  else if(q.kind==='multi'){const a=new Set(q.answer);ok=given&&given.length===4&&given.every(n=>a.has(n));}
  else if(q.kind==='mc'){ok=given===q.answer}
  q.given=given;q.ok=ok;q.err=err;q.ms=performance.now()-q.started;
  G.questions.push(q);
  render.feedback(q);
}
function closeQ(){G.qOpen=false;ROOT.getElementById('qwrap')?.remove();G.lastFrame=0}

function finish(){
  G.running=false;G.over=true;
  const qs=G.questions;const by={};for(const q of qs){(by[q.k]=by[q.k]||{n:0,ok:0}).n++;if(q.ok)by[q.k].ok++}
  const el=qs.filter(q=>q.k==='elixir'&&q.err!=null);
  const rec={at:Date.now(),mode:G.mode,opp:G.op.deck.t,n:qs.length,ok:qs.filter(q=>q.ok).length,mae:el.length?el.reduce((a,q)=>a+q.err,0)/el.length:null,by,oppLeak:G.op.leaked,myLeak:G.me.leaked};
  const H=store.get('history',[]);H.push(rec);store.set('history',H.slice(-200));
  render.summary(rec);
}

function quizQ(depth=0){
  if(depth>8)return {k:'math',label:'Rules and timing',prompt:KB.facts[0][0],kind:'mc',opts:shuffle(KB.facts[0][1]),answer:KB.facts[0][2],why:KB.facts[0][3]};
  const types=Object.keys(S.quizTypes).filter(k=>S.quizTypes[k]);if(!types.length)return null;
  const k=pick(types);const allCards=Object.keys(RAW.cards);
  const mc=(prompt,right,wrongs,why,label)=>{const o=shuffle([right,...shuffle(wrongs.filter(w=>w!==right)).slice(0,3)]);return {k,label,prompt,kind:'mc',opts:o,answer:right,why}};
  if(k==='cost'){const n=pick(allCards);const c=cost(n);return mc(`How much elixir does <b>${esc(n)}</b> cost?`,String(c),[c-1,c+1,c+2,c-2].filter(x=>x>0&&x<=10).map(String),`${esc(n)} costs ${c}.`,'Card cost')}
  if(k==='ability'){const all=Object.entries(HERO_AB).map(([n,c])=>['Hero '+n,c]).concat(Object.entries(CHAMP_AB));const [n,c]=pick(all);return mc(`How much elixir does the <b>${esc(n)}</b> ability cost?`,String(c),['1','2','3','4','5'],`${esc(n)}'s ability costs ${c}. ${n.startsWith('Hero')?'Hero abilities are one use per deployment.':'Champion abilities can be reused after a cooldown while the champion is alive.'}`,'Ability cost')}
  if(k==='evo'){const ks=Object.keys(EVO_KNOWN);const n=pick(ks);const c=EVO_KNOWN[n];return mc(`How many cycles does <b>Evo ${esc(n)}</b> need?`,String(c),['1','2','3'],`Listed as ${c} (gamingonphone evolution list). If the game shows a different number, change it in Settings so the match tracker uses yours.`,'Evolution cycles')}
  if(k==='trade'){const [a,b,why]=pick(KB.counter);const d=cost(a)-cost(b);const s=d>0?`+${d}`:String(d);
    return mc(`They play <b>${esc(a)}</b> (${cost(a)}). You answer with <b>${esc(b)}</b> (${cost(b)}) and it fully counters. What is your elixir trade?`,s,['+1','+2','+3','0','-1','-2'],`${cost(a)} − ${cost(b)} = ${s}. ${why}`,'Elixir trade')}
  if(k==='counter'){const [a,b,why]=pick(KB.counter);const wr=shuffle(allCards.filter(n=>n!==b&&!KB.counter.some(x=>x[0]===a&&x[1]===n))).slice(0,6);
    return mc(`Which card is the standard clean answer to <b>${esc(a)}</b>?`,b,wr,why,'Counter')}
  if(k==='placement'){const [d,p]=pick(KB.placement);return mc(`Hog 2.6: which Cannon placement? <br><span class="mute">${esc(d)}</span>`,p,KB.placement.map(x=>x[1]),`${p}. From your Hog 2.6 Masterclass cheat sheet.`,'Placement')}
  if(k==='math'){const f=pick(KB.facts);return {k,label:'Rules and timing',prompt:f[0],kind:'mc',opts:shuffle(f[1]),answer:f[2],why:f[3]}}
  if(k==='deck'){const d=pick(poolDecks());const cs=d.c.map(cost).sort((a,b)=>a-b);const sub=pick(['avg','cycle','wc']);
    const show=`<div class="cards" style="margin-top:8px">${d.c.map(n=>cardHTML(n,{size:'sm',role:d.r[n]})).join('')}</div>`;
    if(sub==='avg'){const a=(d.c.reduce((s,n)=>s+cost(n),0)/8).toFixed(1);return mc(`What is this deck's average elixir?${show}`,a,[(+a-.3).toFixed(1),(+a+.3).toFixed(1),(+a+.6).toFixed(1),(+a-.6).toFixed(1)],`Sum ${d.c.reduce((s,n)=>s+cost(n),0)} ÷ 8 = ${a}.`,'Deck reading')}
    if(sub==='cycle'){const c=cs.slice(0,4).reduce((a,b)=>a+b,0);return mc(`What is this deck's 4-card cycle?${show}`,String(c),[c-1,c+1,c+2,c-2].filter(x=>x>3).map(String),`Its 4 cheapest cards cost ${cs.slice(0,4).join(' + ')} = ${c}.`,'Deck reading')}
    const wc=d.c.filter(n=>WINCON.includes(n));if(!wc.length)return quizQ(depth+1);const right=wc[0];const wr=d.c.filter(n=>!WINCON.includes(n));if(wr.length<3)return quizQ(depth+1);
    return mc(`Which card is this deck's main win condition?${show}`,right,wr,`${esc(right)} is the card that takes towers in this list${wc.length>1?' (with '+wc.slice(1).map(esc).join(', ')+')':''}.`,'Deck reading')}
}

match(){

   cycle:'Their deck is hidden until they play each card. Every card shows for 2 seconds, then it is gone. Hold the order in your head: a played card goes to the back and comes back 4 plays later. Questions: is a card in their hand, which comes back next, which card did they play 3 plays ago.',

<p class="lbl" id="histlbl" style="margin-top:2px" ${S.memory?'hidden':''}>Their recent plays</p>

</div>`:`<div class="side"><div class="who"><b>Watch mode</b><span class="mute small">You don't play. Count their elixir.</span></div><p class="mute small">Their elixir bar is hidden on purpose. Use the play times above and the clock.</p></div>`}

hud(){

  const ph=$('#phase');if(ph){const p=phaseAt(G.t);ph.textContent=S.showPhase?p+'× elixir'+(G.t>=180?' · OT':''):'';ph.className='phase'+(S.showPhase&&p>1?' x'+p:'');ph.hidden=!S.showPhase}
  const os=$('#opstatus');if(os){const chips=[];const pumps=G.op.pumps.filter(p=>p.alive);if(S.showPump&&pumps.length)chips.push(`<span class="chip p">Pump up · ${pumps.map(p=>p.made+'/'+PUMP.max).join(', ')} made</span>`);

feed(){
  if(view!=='match')return;
  const mk=(who,box)=>{const el=$(box);if(!el)return;let evs=G.events.filter(e=>e.who===who&&e.card);
    if(who==='op'&&!S.showLog)evs=evs.slice(-1);
    el.innerHTML=evs.slice(-14).map((e,k,a)=>`<div class="ev ${k===a.length-1?'new':''}">${cardHTML(e.card,{size:'sm',role:e.role==='evo'?'evo':e.role==='hero'?'hero':null,evolved:e.evolved,cost:e.cost})}${e.ability?'<span class="abil">ABILITY</span>':''}<span class="ts">${fmtT(e.t)}</span></div>`).join('')||'<span class="mute small">No plays yet</span>';
    el.scrollLeft=el.scrollWidth};
  mk('op','#opfeed');mk('me','#mefeed');
  const ar=$('#arena'),ll=$('#lastline');
  if(ar){
    const tok=(e,who)=>{if(e.lane==null){e.lane=Math.random()<.5?0:1;e.dy=Math.random()}
      const x=e.lane?72:28, y=who==='op'?12+e.dy*22:62+e.dy*18;
      return `<div class="tok ${who}${G.memHide&&who==='op'?' gone':''}" style="left:${x}%;top:${y}%">${cardHTML(e.card,{size:'sm',role:e.role==='evo'?'evo':e.role==='hero'?'hero':null,evolved:e.evolved,cost:e.cost})}</div>`};
    const lastOp=[...G.events].reverse().find(e=>e.who==='op'&&e.card);
    const lastMe=[...G.events].reverse().find(e=>e.who==='me'&&e.card);
    if(lastOp&&G.lastBig!==lastOp){G.lastBig=lastOp;G.memHide=false;clearTimeout(G.memT);
      if(S.memory)G.memT=setTimeout(()=>{G.memHide=true;const t=$('#arena .tok.op');if(t)t.classList.add('gone');const l=$('#lastline');if(l)l.innerHTML=`<span class="mute small">Remember it · ${G.op.plays.filter(e=>!e.ability).length} plays so far</span>`},2000)}
    ar.querySelectorAll('.tok').forEach(t=>t.remove());
    ar.insertAdjacentHTML('beforeend',(lastOp?tok(lastOp,'op'):'')+(lastMe?tok(lastMe,'me'):''));
    if(ll&&lastOp&&!(S.memory&&G.memHide))ll.innerHTML=`<b>${esc(lastOp.card)}${lastOp.ability?' ability':''}${lastOp.evolved?' (evolved)':''}</b> <span class="mono" style="color:#f4a0f6">−${lastOp.cost}</span> <span class="mute small mono">${fmtT(lastOp.t)}</span>`;
  }
  const ab=$('#abil');if(ab){ab.innerHTML=(!aiControlled(G.me)?G.me.ready:[]).map((a,k)=>`<button class="btn gold" data-ab="${k}" ${a.next&&G.t<a.next?'disabled':''}>⚡ ${esc(a.card)} ability (${a.cost})${a.next&&G.t<a.next?' · recharging':''}</button>`).join('');
    ab.querySelectorAll('[data-ab]').forEach(b=>b.onclick=()=>{const a=G.me.ready[+b.dataset.ab];if(!a||!G.running||G.qOpen||(a.next&&G.t<a.next))return;if(G.me.elixir+1e-9<a.cost)return;
      const before=G.me.elixir;G.me.elixir-=a.cost;const ev={t:G.t,who:'me',card:a.card,cost:a.cost,before,after:G.me.elixir,ability:true};G.events.push(ev);G.me.plays.push(ev);
      if(!a.champ)G.me.ready.splice(+b.dataset.ab,1);else a.next=G.t+12;render.feed()})}
  const od=$('#opdeck');if(od)od.innerHTML=G.op.deck.c.filter(n=>S.revealDeck||G.op.seen.has(n)).map(n=>cardHTML(n,{size:'sm',role:G.op.roles[n],pips:G.op.roles[n]==='evo'&&S.qTypes.evo?null:null})).join('');
  const h=$('#hand');if(h&&S.youPlay){const p=G.me;h.innerHTML=p.hand.map(n=>cardHTML(n,{button:1,role:p.roles[n],pips:p.roles[n]==='evo'?p.evo[n]:null,evolved:p.roles[n]==='evo'&&p.evo[n]>=evoCycles(n)})).join('')+(p.queue[0]?`<div class="nextc">${cardHTML(p.queue[0],{size:'sm',role:p.roles[p.queue[0]]})}NEXT</div>`:'');
    h.querySelectorAll('button.card').forEach(b=>b.onclick=()=>{if(!G.running||G.qOpen)return;if(doPlay(G.me,b.dataset.card))afterPlay('me')})}
  render.hud();
},

  c.innerHTML=G.over?`<button class="btn pri" data-go="again">New match</button>`:`${G.running?'<button class="btn" data-pause="1">Pause</button>':`<button class="btn pri" data-start="1">${G.t>S.startAt?'Resume':'Start'}</button>`}<button class="btn" data-ask="1" ${G.running?'':'disabled'}>Ask me now</button><button class="btn" data-peek="1" aria-pressed="${S.showOppElixir}">${S.showOppElixir?'Hide':'Show'} their elixir</button><button class="btn" data-mem="1" aria-pressed="${S.memory}">Memory mode</button><button class="btn" data-end="1">End</button><button class="btn" data-view="home" aria-label="Exit drill">Exit</button>`;

question(q){
  const w=document.createElement('div');w.className='qwrap';w.id='qwrap';
  let input='';
  if(q.kind==='pad'){const max=q.max??10;input=`<div class="pad">${Array.from({length:max+1},(_,v)=>`<button data-a="${v}">${v}</button>`).join('')}</div>`}
  if(q.kind==='diff'){input=`<div class="pad">${Array.from({length:21},(_,k)=>k-10).filter(v=>v>=-10&&v<=10).map(v=>`<button data-a="${v}">${v>0?'+'+v:v}</button>`).join('')}</div><p class="mute small">+ means you are up, − means they are up.</p>`}
  if(q.kind==='mc'){input=`<div class="opts" id="mcopts">${q.opts.map(o=>`<button data-mc="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}
  if(q.kind==='multi'){input=`<div class="cards" id="msel">${q.opts.map(n=>cardHTML(n,{button:1,role:G.op.roles[n]})).join('')}</div><button class="btn pri" id="msub" disabled>Lock in 4 cards</button>`}
  const recent=G.events.filter(e=>e.who==='op'&&e.card).slice(S.showLog?-4:-1);
  const ctx=!S.memory&&(q.k==='elixir'||q.k==='diff')&&recent.length?`<div><p class="lbl">Their last ${recent.length>1?recent.length+' plays':'play'} · clock now ${fmtT(q.t)}</p><div class="cards" style="margin-top:6px">${recent.map(e=>`<div class="ev" style="display:flex;flex-direction:column;align-items:center;gap:2px">${cardHTML(e.card,{size:'sm',role:e.role==='evo'?'evo':e.role==='hero'?'hero':null,cost:e.cost})}<span style="font-size:11px;font-weight:800;max-width:70px;text-align:center;line-height:1.1">${esc(e.card)}${e.ability?' ability':''} −${e.cost}</span><span class="mono" style="font-size:10px;color:var(--mute)">${fmtT(e.t)}</span></div>`).join('')}</div></div>`:'';
  w.innerHTML=`<div class="q" role="dialog" aria-modal="true" aria-labelledby="qh"><div class="row" style="justify-content:space-between"><span class="qk">${esc(q.label)} · ${fmtT(q.t)}</span><span class="qk">${G.questions.length+1}</span></div><h2 id="qh">${q.prompt}</h2>${ctx}${S.timer?'<div class="timer"><b id="tb"></b></div>':''}${input}<div id="fb"></div></div>`;
  ROOT.querySelector('.labroot').appendChild(w);
  w.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(q.done)return;q.done=1;answer(q,+b.dataset.a)});
  w.querySelectorAll('[data-mc]').forEach(b=>b.onclick=()=>{if(q.done)return;q.done=1;answer(q,b.dataset.mc)});
  if(q.kind==='multi'){const sel=new Set();w.querySelectorAll('#msel button.card').forEach(b=>b.onclick=()=>{if(q.done)return;const n=b.dataset.card;sel.has(n)?sel.delete(n):sel.size<4&&sel.add(n);b.classList.toggle('sel',sel.has(n));$('#msub').disabled=sel.size!==4});
    $('#msub').onclick=()=>{if(q.done)return;q.done=1;answer(q,[...sel])}}
  if(S.timer){const T=S.timer*1000;const st=performance.now();qTimer=setInterval(()=>{const f=1-(performance.now()-st)/T;const tb=$('#tb');if(tb)tb.style.transform=`scaleX(${Math.max(0,f)})`;if(f<=0&&!q.done){q.done=1;answer(q,null)}},50)}
  w.querySelector('button')?.focus();
},

summary(rec){

  const grid=[0,2,4,6,8,10].map(v=>`<line x1="${pad}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="#2c3a60" stroke-width="1"/><text x="${pad-8}" y="${y(v)+4}" fill="#93a0c4" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">${v}</text>`).join('');

  el.innerHTML=`<section class="panel" style="display:flex;flex-direction:column;gap:14px">
   <div class="top"><h2>Match review</h2><div class="row"><button class="btn" data-go="home">Change drill</button><button class="btn pri" data-go="again">Play again</button></div></div>
   <p class="mute small">Opponent: ${esc(G.op.deck.t)} · their style: ${G.style} · ended at ${fmtT(G.t)}</p>
   <div class="kpis"><div class="kpi"><div class="n">${rec.ok}/${rec.n}</div><div class="l">Questions right</div></div>
    <div class="kpi"><div class="n">${rec.mae!=null?rec.mae.toFixed(2):'—'}</div><div class="l">Avg elixir miss</div></div>
    <div class="kpi"><div class="n">${G.op.plays.filter(e=>!e.ability).length}</div><div class="l">Cards they played</div></div>
    <div class="kpi"><div class="n">${rec.oppLeak.toFixed(1)}</div><div class="l">Elixir they leaked</div></div>
    ${S.youPlay?`<div class="kpi"><div class="n">${rec.myLeak.toFixed(1)}</div><div class="l">Elixir you leaked</div></div>`:''}</div>
   <div><h3>Their elixir, minute by minute</h3><p class="mute small">Purple line: what they really had. Gold ticks: each play. Dots: your guesses (green right, red wrong). Shaded: double elixir.</p>

   ${byRows?`<div class="tblw"><table><thead><tr><th>Question type</th><th>Score</th><th>Rate</th></tr></thead><tbody>${byRows}</tbody></table></div>`:''}
   <details><summary class="mute">Every question</summary><div class="tblw"><table><thead><tr><th>Time</th><th>Type</th><th>Answer</th><th>You</th></tr></thead><tbody>${qs.map(q=>`<tr><td class="mono">${fmtT(q.t)}</td><td>${q.label}</td><td>${Array.isArray(q.answer)?q.answer.map(esc).join(', '):q.answer}${q.exact!=null?` <span class="mute mono">(${q.exact.toFixed(1)})</span>`:''}</td><td class="${q.ok?'good':'bad'}">${q.given==null?'timeout':Array.isArray(q.given)?q.given.map(esc).join(', '):q.given}</td></tr>`).join('')}</tbody></table></div></details>

quiz(showFb){

},
quizSum(){
  const r=QZ.res||[];const by={};for(const q of r){(by[q.k]=by[q.k]||{n:0,ok:0}).n++;if(q.ok)by[q.k].ok++}
  const miss=r.filter(q=>!q.ok);

stats(){

let presetBackup=null;
function beginMatch(mode){
  if(presetBackup){Object.assign(S,presetBackup);presetBackup=null}
  if(mode!=='custom'&&PRESETS[mode]){presetBackup=JSON.parse(JSON.stringify(S));Object.assign(S,PRESETS[mode].set);if(PRESETS[mode].types)S.qTypes=Object.assign({},PRESETS[mode].types)}
  newMatch();G.mode=mode;view='match';render.page();
}
function restoreSettings(){if(presetBackup){Object.assign(S,presetBackup);presetBackup=null}}
app.addEventListener('click',e=>{
  const b=e.target.closest('button,[data-view]');if(!b)return;const d=b.dataset;
  if(d.view){if(view==='match'){pause();restoreSettings()}clearInterval(qTimer);view=d.view;render.page();return}
  if(d.preset){beginMatch(d.preset);return}
  if(d.quiz){restoreSettings();view='quiz';startQuiz();render.page();return}
  if(d.go==='custom'){beginMatch('custom');return}
  if(d.go==='again'){const m=G.mode||'custom';restoreSettings();beginMatch(m);return}
  if(d.go==='home'){restoreSettings();view='home';render.page();return}
  if(d.start){start();return}
  if(d.pause){pause();return}
  if(d.ask){ask();return}
  if(d.mem){S.memory=!S.memory;saveS();['#opfeed','#histlbl'].forEach(q=>{const el=$(q);if(el)el.hidden=S.memory});render.controls();render.feed();return}
  if(d.peek){S.showOppElixir=!S.showOppElixir;saveS();const el=$('#oppelix');if(el)el.hidden=!S.showOppElixir;render.controls();render.hud();return}
  if(d.end){finish();restoreSettings();return}
  if(d.quizend){quizDone();return}
  if(d.set){let v=d.val;if(!isNaN(+v)&&v!=='')v=+v;S[d.set]=v;saveS();render.page();return}
  if(d.pickdeck){render.page();render.picker(d.pickdeck);return}
  if(d.choose){if(d.choose==='opp')S.oppDeck=+d.i;else S.myDeck=+d.i;saveS();render.page();return}
  if(d.clear){S[d.clear]=-1;saveS();render.page();return}
  if(d.reset){S=JSON.parse(JSON.stringify(DEFAULTS));saveS();render.page();return}
  if(d.wipe){const w=$('#wipeask');w.innerHTML='Sure? <button class="btn" data-wipeyes="1">Yes, clear it</button>';return}
  if(d.wipeyes){store.set('history',[]);render.page();return}
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.pool){const g=t.dataset.pool;const nx=t.checked?[...new Set([...S.oppPool,g])]:S.oppPool.filter(x=>x!==g);if(!nx.length){t.checked=true;return}S.oppPool=nx;saveS();render.page();return}
  if(t.dataset.ck){if(t.dataset.obj)S[t.dataset.obj][t.dataset.ck]=t.checked;else S[t.dataset.ck]=t.checked;saveS();render.page();return}
  if(t.dataset.evo){S.evoOverride[t.dataset.evo]=+t.value;saveS();render.page();return}
});
ON('keydown',e=>{if(!ACTIVE())return;
  if(e.key==='Enter'){const n=$('#qnext')||$('#qznext');if(n){e.preventDefault();n.click();return}}
  if(G.qOpen&&/^[0-9]$/.test(e.key)){const b=ROOT.querySelector(`#qwrap [data-a="${e.key}"]`);if(b&&!b.disabled)b.click()}
  if(view==='quiz'&&/^[1-4]$/.test(e.key)&&!$('#qznext')){const bs=ROOT.querySelectorAll('#quiz [data-o]');const b=bs[+e.key-1];if(b)b.click()}
  if(view==='match'&&e.key===' '&&!G.qOpen&&(e.target===document.body||e.target===HOST)){e.preventDefault();G.running?pause():G.over||start()}
});
ON('visibilitychange',()=>{if(document.hidden&&G.running)pause()});
render.page();
return {pause:()=>{if(G.running)pause()}};

s:8px;padding:6px;text-align:left;min-width:0}\n.ditem[aria-pressed=true]{border-color:var(--gold)}\n.ditem .dt{font-weight:800;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.ditem .cards{flex-wrap:nowrap;gap:3px}\n.ditem .card.sm{width:30px}.ditem .card.sm .ab{font-size:10px;margin-top:6px}\n.note{font-size:12.5px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px}\n.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px}\n/* arena */\n.arena{position:relative;height:178px;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,#3b2a4d 0%,#2f2545 46%,#2d5f8f 46%,#3a78ab 54%,#22324f 54%,#1e2a46 100%);border:1px solid var(--line)}\n.arena .river{position:absolute;left:0;right:0;top:46%;height:8%;background:repeating-linear-gradient(90deg,transparent 0 14px,#ffffff14 14px 28px)}\n.arena .lane{position:absolute;top:0;bottom:0;width:18%;background:#ffffff08}\n.arena .lane.l{left:19%}.arena .lane.r{right:19%}\n.arena .atow{position:absolute;width:22px;height:22px;border-radius:6px;background:#ff5d6c55;border:1px solid #ff5d6c88}\n.arena .t1{left:calc(28% - 11px);top:4%}.arena .t2{left:calc(72% - 11px);top:4%}\n.arena .t3,.arena .t4{background:#4f7bff55;border-color:#4f7bff99;bottom:4%}.arena .t3{left:calc(28% - 11px)}.arena .t4{left:calc(72% - 11px)}\n.arena .tok{position:absolute;transform:translate(-50%,0);transition:opacity .5s}\n.arena .tok .card{width:44px;animation:pop .45s ease-out}\n.arena .tok.gone{opacity:0}\n.lastline{min-height:22px;font-size:15px}\n@media (prefers-reduced-motion:reduce){.arena .tok .card{animation:none}}\n/* compact match screen: everything on one phone screen */\n.mtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.howd{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:13px}\n.howd summary{cursor:pointer;font-weight:800;color:var(--mute)}\n.howd p{margin-top:6px}\n.clockbar{padding:6px 10px;flex-wrap:wrap}\n.phase{white-space:nowrap}\n.ctl{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:2px}\n.ctl .btn{flex:none;white-space:nowrap}\n.ctl .btn{padding:6px 10px;font-size:13px}\n.ctl .btn[aria-pressed=true]{border-color:var(--elixir);color:#f4a0f6}\n.side{padding:10px;gap:8px}\n.big{min-height:0;justify-content:flex-start;gap:12px}\n.big .card{width:70px}\n.feed{min-height:0}\n.memo{display:grid;place-items:center;width:70px;aspect-ratio:3/4;border:2px dashed var(--line);border-radius:9px;font-family:var(--display);font-size:26px;color:var(--dim)}\n.hud{gap:8px}\n@media (max-width:520px){h1{font-size:25px}.card{width:56px}.card.lg{width:82px}.pad button{font-size:19px;padding:9px 0}}\n\n/* CR Decks app: card pictures from pics/ (and any you added) fill the tile; cost, EVO/HERO tag and evo pips sit on top */\n.card.pic{padding:0;background:#10182e}\n.card.pic>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}\n.card.pic .ab,.card.pic .nm{display:none}\n.card.pic .cost,.card.pic .tag,.card.pic .pips{z-index:1}\n.card.pic .tag{text-shadow:none}\n.qwrap{font-family:var(--body);color:var(--fg);line-height:1.45}\n/* deck lists: on a phone the name goes on its own line above the 8 cards */\n@media (max-width:560px){.deckpick .row input[type=search]{flex:1 1 100%!important}.deckpick .row select{flex:1 1 100%;width:100%!important}.ditem{flex-wrap:wrap}.ditem>div:first-child{flex:1 1 100%!important}.ditem .card.sm{width:34px}}\n";

<script>
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const uniq=a=>[...new Set(a)];
const CARDS=DATA.cards;
for(const [n,[id,c]] of Object.entries(NAMEID)) if(!CARDS[id]) CARDS[id]=[n,c];
const EVO=new Set(DATA.evo), HERO=new Set(DATA.hero), CHAMPS=new Set(DATA.champ);
const TTID={"Tower Princess":159000000,"Cannoneer":159000001,"Dagger Duchess":159000002,"Royal Chef":159000004};
const TTNAME=Object.fromEntries(Object.entries(TTID).map(([k,v])=>[v,k]));
const typeOf=id=>{const t=String(id).slice(0,2);return t==="27"?"building":t==="28"?"spell":"troop"};
const normId=id=>id===36000000?26000000:id===36000002?26000002:id;
const cname=id=>(CARDS[id]||CUSTOM[id]||["Card "+id,0])[0];
const ccost=id=>(CARDS[id]||CUSTOM[id]||["",0])[1];
const dkey=ids=>[...ids].map(Number).sort((a,b)=>a-b).join("-");
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(_){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){toast("Couldn't save on this device: storage is full or blocked.");return false}};
let CUSTOM=lsGet("crd-cards",{}); // cards the app didn't know: id -> [name, cost]
for(const [id,v] of Object.entries(CUSTOM)) if(!CARDS[id]) CARDS[id]=v;
let FORMS=lsGet("crd-forms",{evo:[],hero:[]}); // forms you added yourself: card names
const BASEEVO=new Set(DATA.evo),BASEHERO=new Set(DATA.hero);
function applyForms(){FORMS={evo:FORMS.evo||[],hero:FORMS.hero||[]};for(const n of [...EVO])if(!BASEEVO.has(n))EVO.delete(n);for(const n of [...HERO])if(!BASEHERO.has(n))HERO.delete(n);FORMS.evo.forEach(n=>EVO.add(n));FORMS.hero.forEach(n=>HERO.add(n))}
applyForms();
function toast(t){const el=$("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2600)}

/* ---------- decks ---------- */
const BASE=DATA.decks.map((d,i)=>({...d,i,key:dkey(d.ids),active:0,user:false,oppOnly:d.variants.every(v=>v.srcs.length&&v.srcs.every(x=>/^Opponent's deck \(/.test(x)))}));
let USER=lsGet("crd-user",[]);       // decks you added: {key, title, arch, notes, added, variants:[{roles, order, tt}]}
let HIDDEN=new Set(lsGet("crd-hidden",[]));
let D=[], BYKEY={};
function specialsOf(roles,order){const r=[];for(const id of order){const k=roles[id];if(k==="evo")r.push("Evo "+cname(id));else if(k==="hero")r.push("Hero "+cname(id));}for(const id of order)if(CHAMPS.has(cname(id)))r.push(cname(id));return r}
function linkOf(order,tt){return "https://link.clashroyale.com/en/?clashroyale://copyDeck?deck="+order.join(";")+"&l=Royals"+(tt?"&tt="+tt:"")}
function fmtDate(t){return new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})}
function userVariant(u,v){const order=v.order.map(Number);const roles={};for(const [k,x] of Object.entries(v.roles||{}))roles[k]=x;
  return {roles,tt:v.tt?String(v.tt):"",link:linkOf(order,v.tt),order,uses:null,wr:null,srcs:["Added by you · "+fmtDate(v.added||u.added)],mine:null,era:"now",names:[u.title],specials:specialsOf(roles,order),earliest:"",earliestWhy:"",eraLabel:"Added "+fmtDate(v.added||u.added),tower:TTNAME[v.tt]||"Tower Princess",user:true}}
function rebuild(){
  BYKEY={};D=[];
  for(const d of BASE){const c={...d,variants:d.variants.slice(),notes:d.notes.slice()};D.push(c);BYKEY[c.key]=c}
  for(const u of USER){
    const ex=BYKEY[u.key];const vs=u.variants.map(v=>userVariant(u,v));
    if(ex&&!ex.user){ex.variants=vs.concat(ex.variants);ex.userAdd=u;ex.oppOnly=false;if(u.notes)ex.notes.unshift(u.notes);if(u.title&&u.title!==ex.title)ex.aka=[u.title,...(ex.aka||[])];continue}
    const ids=u.variants[0].order.map(Number);const costs=ids.map(ccost);
    const d={ids,title:u.title||autoTitle(u.variants[0].roles,ids),aka:[],arch:u.arch||[],era:"now",eraLabel:"Added by you",avg:costs.reduce((a,b)=>a+b,0)/8,cycle:[...costs].sort((a,b)=>a-b).slice(0,4).reduce((a,b)=>a+b,0),variants:vs,mine:null,notes:u.notes?[u.notes]:[],pop:0,swaps:[],i:D.length,key:u.key,active:0,user:true,userAdd:u,added:u.added};
    D.push(d);BYKEY[d.key]=d}
  D.forEach((d,i)=>d.i=i);
  ARCHS=uniq(D.flatMap(d=>d.arch)).sort();
}
let ARCHS=[];
function autoTitle(roles,ids){const sp=ids.filter(id=>roles[id]).map(id=>(roles[id]==="evo"?"Evo ":"Hero ")+cname(id));const win=ids.find(id=>["Hog Rider","Royal Giant","Golem","Giant","Balloon","Graveyard","X-Bow","Mortar","Miner","Goblin Barrel","Royal Hogs","Lava Hound","Electro Giant","P.E.K.K.A","Mega Knight","Goblin Drill","Ram Rider","Battle Ram","Wall Breakers","Three Musketeers","Elixir Golem","Sparky","Giant Skeleton","Goblin Giant","Skeleton Barrel","Rune Giant","Boss Bandit","Goblinstein"].includes(cname(id)));
  return [win?cname(win):null,...sp].filter(Boolean).slice(0,3).join(" · ")||ids.slice(0,3).map(cname).join(" · ")}
function saveUser(){lsSet("crd-user",USER);rebuild()}

/* ---------- pictures ---------- */
const BPICS=new Set(BUNDLED_PICS);let UPICS={},PIDB=null,EDIT=false;
function picFor(cid,form){const k=cid+"_"+form, b=cid+"_base";
  if(k in UPICS)return UPICS[k]; if(BPICS.has(k))return "pics/"+k+".webp";
  if(form!=="base"){if(b in UPICS)return UPICS[b];if(BPICS.has(b))return "pics/"+b+".webp"}
  return null}
function idbOpen(name,store,opts){return new Promise((res,rej)=>{const r=indexedDB.open(name,1);r.onupgradeneeded=()=>r.result.createObjectStore(store,opts);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbDo(db,store,mode,fn){return new Promise((res,rej)=>{const tx=db.transaction(store,mode);const o=fn(tx.objectStore(store));tx.oncomplete=()=>res(o&&o.result);tx.onerror=()=>rej(tx.error)})}
async function loadPics(){try{PIDB=PIDB||await idbOpen("crd-pics","pics");const keys=await idbDo(PIDB,"pics","readonly",s=>s.getAllKeys());const m={};
  for(const k of keys){const b=await idbDo(PIDB,"pics","readonly",s=>s.get(k));m[k]=b?URL.createObjectURL(b):null}
  Object.values(UPICS).forEach(u=>u&&URL.revokeObjectURL(u));UPICS=m}catch(_){}}

/* ---------- tiles ---------- */
function tile(id,role,hit){id=Number(id);const cid=normId(id);const n=cname(id);const r=role||(CHAMPS.has(n)?"champ":"");const form=r==="evo"||r==="hero"?r:"base";const pic=picFor(cid,form);
  const rl=r?{evo:"EVO",hero:"HERO",champ:"CHAMP"}[r]:"";
  return `<div class="cd ${typeOf(id)} ${r}${pic?" pic":""}${hit?" hit":""}" data-card="${cid}" data-form="${form}" title="${esc(n)}">${pic?`<img src="${esc(pic)}" alt="" loading="lazy" decoding="async">`:""}<span class="cost">${ccost(id)}</span>${rl?`<span class="rl ${r}">${rl}</span>`:""}<span class="nm">${esc(n)}</span></div>`}

/* ---------- favorites ---------- */
let FAVS=lsGet("crd-favs",null);
if(!FAVS){FAVS={};for(const f of SEEDFAV)FAVS[f.k]=f;lsSet("crd-favs",FAVS)}
const isFav=k=>!!FAVS[k];
function favBtn(k){const on=isFav(k);return `<button class="fav" type="button" data-fav="${k}" aria-pressed="${on}" aria-label="${on?"Remove from favorites":"Add to favorites"}">${on?"♥":"♡"}</button>`}

/* ---------- state ---------- */
let VIEW="lib";
let S={sec:"all",q:"",arch:"",spec:"",era:"",tower:"",sort:"pop",only:null};
let BV={side:"played",mode:"",sort:""};
const ERA_OPTS=[["","All meta periods"],["now","Oct 2026 · current"],["sep","Sep 2026"],["3slot","Mar–Aug 2026 · 3-slot era"],["4slot","Dec 2025–Mar 2026 · 4-slot era"]];
const SECS=[["all","All"],["main","★ Main"],["mine","I play"],["user","Added by me"],["tr","Trophy Road"],["war","Clan war"],["now","Current"],["prev","Older"]];
const PICKS=[["Golem",{arch:"Golem"}],["Rune Giant",{arch:"Rune Giant"}],["Evo E-Giant",{spec:"Evo Electro Giant"}],["Sparky",{arch:"Sparky"}],["LumberLoon",{arch:"LumberLoon"}],["Giant Prince",{arch:"Giant Prince"}],["Evo Lumberjack",{spec:"Evo Lumberjack"}],["Hero Balloon",{spec:"Hero Balloon"}],["Miner Loon",{arch:"Miner Loon"}],["Log Bait",{arch:"Log Bait"}],["Dagger Duchess",{tower:"Dagger Duchess"}],["Cannoneer",{tower:"Cannoneer"}]];
const SORTS=[["pop","Most popular first"],["fav","Favorites first"],["new","Newest added first"],["mywr","My best win rate"],["mygames","Most played by me"],["low","Cheapest first"],["high","Heaviest first"],["name","A to Z"]];
try{const p=lsGet("crd-prefs",{});if(p.sort)S.sort=p.sort;if(p.bv)BV=Object.assign(BV,p.bv)}catch(_){}
function savePrefs(){lsSet("crd-prefs",{sort:S.sort,bv:BV})}

function matchDeck(d){
  if(HIDDEN.has(d.key)&&S.sec!=="hidden")return false;
  if(S.only!=null)return d.i===S.only;
  if(S.sec==="mine"&&!d.mine)return false;
  if(S.sec==="main"&&!d.tier)return false;
  if(S.sec==="user"&&!d.userAdd)return false;
  if(S.sec==="tr"&&!(d.slot&&d.slot.tr))return false;
  if(S.sec==="war"&&!(d.slot&&(d.slot.war||d.slot.waralt)))return false;
  if(S.sec==="now"&&d.era!=="now")return false;
  if(S.sec==="prev"&&d.era==="now")return false;
  if(S.arch&&!d.arch.includes(S.arch))return false;
  if(S.spec&&!d.variants.some(v=>v.specials.includes(S.spec)))return false;
  if(S.era&&!d.variants.some(v=>v.era===S.era))return false;
  if(S.tower&&!d.variants.some(v=>v.tower===S.tower))return false;
  if(S.q){const s=S.q.toLowerCase();if(!d.hay)d.hay=[d.title,...(d.aka||[]),...d.arch,...d.ids.map(cname),...d.variants.flatMap(v=>v.specials)].join(" ").toLowerCase();if(!d.hay.includes(s))return false}
  return true}
function bestVar(d){const ok=d.variants.map((v,k)=>((!S.spec||v.specials.includes(S.spec))&&(!S.era||v.era===S.era)&&(!S.tower||v.tower===S.tower))?k:-1).filter(k=>k>=0);return ok.includes(d.active)?d.active:(ok[0]??0)}
function varOrder(v){if(v.order)return v.order.map(Number);const m=v.link.match(/deck=([\d;]+)/);return m?m[1].split(";").map(Number):[]}
function fmtUses(v){if(v.uses==null)return "";return v.uses.toLocaleString()+(v.srcs.some(s=>s.includes("RoyaleTracker"))?" games":" battles")+(v.wr!=null?` · ${v.wr}% WR`:"")}
function cmp(){const wr=d=>d.mine&&(d.mine[0]+d.mine[1])?d.mine[0]/(d.mine[0]+d.mine[1]):-1,gm=d=>d.mine?d.mine[0]+d.mine[1]:0,fv=d=>isFav(d.key)?1:0,tw=d=>d.tier==="main"?2:d.tier==="test"?1:0;
  const pop=(a,b)=>tw(b)-tw(a)||(b.mine?1:0)-(a.mine?1:0)||(b.user?1:0)-(a.user?1:0)||b.pop-a.pop||a.title.localeCompare(b.title);
  return {pop,fav:(a,b)=>fv(b)-fv(a)||pop(a,b),new:(a,b)=>(b.added||b.i)-(a.added||a.i),mywr:(a,b)=>wr(b)-wr(a)||gm(b)-gm(a)||pop(a,b),mygames:(a,b)=>gm(b)-gm(a)||wr(b)-wr(a)||pop(a,b),low:(a,b)=>a.avg-b.avg,high:(a,b)=>b.avg-a.avg,name:(a,b)=>a.title.localeCompare(b.title)}[S.sort]||pop}

function deckHTML(d){
  const vi=bestVar(d), v=d.variants[vi], q=S.q.toLowerCase(), order=varOrder(v);
  const tabs=d.variants.length>1?`<div class="tabs" role="tablist">${d.variants.map((x,k)=>`<button class="tab" type="button" role="tab" aria-selected="${k===vi}" data-tab="${k}">${esc(x.specials.join(" + ")||"No evo / hero")}<small>${x.user?"added by you":x.uses!=null?esc(fmtUses(x)):x.mine?"my deck":esc(x.eraLabel)}</small></button>`).join("")}</div>`:"";
  const tags=[d.tier==="main"?`<span class="tag main">★ Main deck</span>`:d.tier==="test"?`<span class="tag">Worth testing</span>`:"",d.mine?`<span class="tag mine">I play this · ${d.mine[0]}W ${d.mine[1]}L</span>`:"",d.slot&&d.slot.tr?`<span class="tag slot">Trophy Road ${d.slot.tr.join(" & ")}</span>`:"",d.slot&&d.slot.war?`<span class="tag war">Clan war ${d.slot.war.join(" & ")}</span>`:"",d.userAdd?`<span class="tag user">Added by me</span>`:""].join("");
  const sub=[d.arch.slice(0,2).join(" · "),v.tower!=="Tower Princess"?v.tower:""].filter(Boolean).join(" · ")||esc(v.eraLabel);
  return `<article class="dk${d.tier==="main"?" main":""}" data-i="${d.i}"><div class="dh"><div class="dt"><h3>${esc(d.title)}</h3><div class="sub">${esc(sub)}</div></div><span class="elx"><span class="drop"></span>${d.avg.toFixed(1)}</span>${favBtn(d.key)}</div>
  ${tags?`<div class="tags">${tags}</div>`:""}${tabs}<div class="cards">${order.map(id=>tile(id,v.roles[String(id)]||v.roles[String(normId(id))],q&&cname(id).toLowerCase().includes(q))).join("")}</div>

function wireBat(){const m=$("bmode"),s=$("bsort"),f=$("bimp");if(m)m.onchange=()=>{BV.mode=m.value;savePrefs();render()};if(s)s.onchange=()=>{BV.sort=s.value;savePrefs();render()};if(f)f.onchange=importCSV}
function parseCSV(text){const rows=[];let row=[],f="",q=false;for(let i=0;i<text.length;i++){const c=text[i];

function duFind(pool,locks){const n=pool.length,sets=pool.map(d=>new Set(d.ids.map(x=>normId(Number(x))))),sc=pool.map(duScore);
  const ok=(a,b)=>{for(const x of sets[a])if(sets[b].has(x))return false;return true};
  const adj=pool.map(()=>new Uint8Array(n));for(let a=0;a<n;a++)for(let b=a+1;b<n;b++)if(ok(a,b)){adj[a][b]=1;adj[b][a]=1}
  const L=locks.map(k=>pool.findIndex(d=>d.key===k)).filter(i=>i>=0);
  for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++)if(!adj[L[i]][L[j]])return{size:0,res:[],cut:false,clash:true};
  const free=[];for(let i=0;i<n;i++)if(!L.includes(i)&&L.every(l=>adj[l][i]))free.push(i);
  free.sort((a,b)=>sc[b]-sc[a]);

    const go=(start,pick)=>{if(cut)return;if(pick.length===need){if(res.length>=CAP){cut=true;return}res.push(L.concat(pick));return}
      for(let x=start;x<free.length;x++){const i=free[x];let good=true;for(const j of pick)if(!adj[i][j]){good=false;break}if(good){pick.push(i);go(x+1,pick);pick.pop();if(cut)return}}};
