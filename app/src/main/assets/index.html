function picDialog(cid,form){PCUR={cid,form};const k=cid+"_"+form,has=(k in UPICS&&UPICS[k])||(!(k in UPICS)&&BPICS.has(k));
  openSheet(`<h2>${form==="base"?"":form==="evo"?"Evo ":"Hero "}${esc(cname(cid))}</h2><p class="hint">This picture shows on every ${form==="base"?"normal":form} ${esc(cname(cid))} in every deck.${form!=="base"?" Without one, the normal card picture is used.":""}</p>
  <button class="btn gold" type="button" id="pchoose">Choose a picture</button>${has?`<button class="btn danger" type="button" id="prm">Remove this picture</button>`:""}${form!=="base"&&(FORMS[form]||[]).includes(cname(cid))?`<button class="btn danger" type="button" id="prf">Remove this ${form==="evo"?"Evo":"Hero"} form</button>`:""}<button class="btn" type="button" id="px">Cancel</button>`);
  if($("prf"))$("prf").onclick=()=>rmForm(cname(cid),form);
  $("pchoose").onclick=()=>$("picfile").click();if($("prm"))$("prm").onclick=()=>setPic(null);$("px").onclick=closeSheet}
$("picfile").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(f&&PCUR)await setPic(await shrink(f))};
async function shrink(f){try{const bmp=await createImageBitmap(f);const w=Math.min(240,bmp.width),h=Math.round(bmp.height*w/bmp.width);const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(bmp,0,0,w,h);return await new Promise(r=>c.toBlob(b=>r(b||f),"image/webp",.8))}catch(_){return f}}
async function setPic(blob){try{PIDB=PIDB||await idbOpen("crd-pics","pics");await idbDo(PIDB,"pics","readwrite",s=>s.put(blob,PCUR.cid+"_"+PCUR.form));await loadPics();closeSheet();render()}catch(_){toast("Couldn't save the picture on this phone.")}}

/* ---------- filters sheet ---------- */
function filterSheet(){const specs=uniq(D.flatMap(d=>d.variants.flatMap(v=>v.specials))).sort(),towers=uniq(D.flatMap(d=>d.variants.map(v=>v.tower))).sort();
  const sel=(id,first,opts,cur)=>`<select id="${id}"><option value="">${first}</option>${opts.map(o=>Array.isArray(o)?o:[o,o]).map(([v,l])=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
  openSheet(`<h2>Filters</h2>
  <div class="fld"><span class="lab">Sort</span><select id="fsort">${SORTS.map(([v,l])=>`<option value="${v}"${v===S.sort?" selected":""}>${l}</option>`).join("")}</select></div>
  <div class="fld"><span class="lab">Archetype</span>${sel("farch","All archetypes",ARCHS,S.arch)}</div>
  <div class="fld"><span class="lab">Evolution or hero</span>${sel("fspec","Any evo / hero",specs,S.spec)}</div>
  <div class="fld"><span class="lab">Meta period</span>${sel("fera","All meta periods",ERA_OPTS.slice(1),S.era)}</div>
  <div class="fld"><span class="lab">Tower troop</span>${sel("ftower","Any tower troop",towers,S.tower)}</div>
  <div class="fld"><span class="lab">Your picks</span><div class="wrapchips">${PICKS.map(([l,p],k)=>`<button class="chip" type="button" data-pk="${k}" aria-pressed="${Object.entries(p).every(([a,b])=>S[a]===b)}">${l}</button>`).join("")}</div></div>
  <div class="sbtns"><button class="btn" type="button" id="fclear">Clear filters</button><button class="btn gold grow" type="button" id="fdone">Show decks</button></div>`);
  const apply=()=>{S.sort=$("fsort").value;S.arch=$("farch").value;S.spec=$("fspec").value;S.era=$("fera").value;S.tower=$("ftower").value;savePrefs()};
  $("fdone").onclick=()=>{apply();S.only=null;closeSheet();syncTop();render();scrollTo(0,0)};
  $("fclear").onclick=()=>{S={...S,arch:"",spec:"",era:"",tower:"",sec:"all",only:null};closeSheet();syncTop();render()};
  $("sheetBody").querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{const p=PICKS[+b.dataset.pk][1];const on=b.getAttribute("aria-pressed")==="true";["farch","fspec","ftower"].forEach(id=>$(id).value="");if(!on){if(p.arch)$("farch").value=p.arch;if(p.spec)$("fspec").value=p.spec;if(p.tower)$("ftower").value=p.tower}apply();S.only=null;closeSheet();syncTop();render();scrollTo(0,0)})}


/* ---------- Elixir Lab tab ---------- */
// Lab decks are built from this app's decks (data.js plus the ones you added, minus hidden ones). Each version (tab) of a deck
// becomes one Lab deck. Groups: meta = RoyaleAPI/RoyaleTracker/Asaf lists, faced = opponents' decks, mine = decks you play or
// added, liked = your liked lists and your favorites.
const LABH={on:[],api:null,sig:""};
function labRAW(){
  const cards={};for(const [id,v] of Object.entries(CARDS))if(v&&v[0]&&!(v[0] in cards))cards[v[0]]=[Number(id),v[1]];
  const decks=[];
  for(const d of D){if(HIDDEN.has(d.key))continue;const seen=new Set();
    d.variants.forEach((v,vi)=>{const order=(v.order&&v.order.length===8?v.order:d.ids).map(x=>normId(Number(x)));const r={};
      for(const [id,ro] of Object.entries(v.roles||{}))if(ro)r[cname(normId(Number(id)))]=ro;
      const sg=JSON.stringify(Object.entries(r).sort());if(seen.has(sg))return;seen.add(sg);
      const src=v.srcs||[],g=new Set();
      if(src.some(x=>/^Opponent's deck/.test(x)))g.add("faced");
      if(src.some(x=>/liked/i.test(x))||isFav(d.key))g.add("liked");
      if(src.some(x=>/^(RoyaleAPI|RoyaleTracker|Asaf|Your old 'Current meta')/.test(x)))g.add("meta");
      if(d.mine||d.tier||d.userAdd||v.user||src.some(x=>/^(Your (?!'Decks I liked')|Removed from your game|Added by you)/.test(x)))g.add("mine");
      if(!g.size)g.add("meta");
      const multi=d.variants.length>1&&v.specials&&v.specials.length;
      decks.push({t:d.title+(multi&&vi>0?" · "+v.specials.join(" + "):""),g:[...g],a:d.arch||[],c:order.map(cname),r,tw:v.tower||"Tower Princess",m:d.mine||null,tier:d.tier||null,k:d.key+"#"+sg})})}
  return {cards,decks,champ:[...CHAMPS]};
}
function labPic(n,role){const id=LABH.ids[n];if(id==null)return null;return picFor(normId(id),role==="evo"||role==="hero"?role:"base")}
function labSig(){return [D.length,HIDDEN.size,Object.keys(FAVS).length,USER.length,Object.keys(UPICS).length].join("/")}
function mountLab(){
  const host=$("labhost");
  for(const [t,f] of LABH.on)document.removeEventListener(t,f);LABH.on=[];
  const root=host.shadowRoot||host.attachShadow({mode:"open"});
  root.innerHTML=`<style>${LABCSS}</style><div class="labroot"><div class="wrap" id="app"></div></div>`;
  const raw=labRAW();LABH.ids={};for(const [n,[id]] of Object.entries(raw.cards))LABH.ids[n]=id;
  LABH.api=ELAB_START(root,host,raw,labPic,()=>VIEW==="lab",(t,f)=>{document.addEventListener(t,f);LABH.on.push([t,f])});
  LABH.sig=labSig();
}
function renderLab(){$("count").textContent="";
  // rebuild only when your decks, favorites or pictures changed, and never in the middle of a match
  const inMatch=LABH.api&&$("labhost").shadowRoot&&$("labhost").shadowRoot.querySelector(".clockbar");
  if(!LABH.api||(LABH.sig!==labSig()&&!inMatch))mountLab()}

/* ---------- view switching ---------- */
const TITLES={lib:"My decks",fav:"Favorites",bat:"Battles",add:"Add a deck",lab:"Elixir Lab",more:"More"};
function syncTop(){const lib=VIEW==="lib";$("ttl").textContent=TITLES[VIEW];$("srow").hidden=!(lib||VIEW==="fav"||VIEW==="bat");$("fbtn").hidden=!lib;$("secchips").hidden=!lib;
  $("q").placeholder=VIEW==="bat"?"Search a card":"Search a card or deck";
  const n=!!S.arch+!!S.spec+!!S.era+!!S.tower;$("fbadge").hidden=!n;$("fbadge").textContent=n;
  $("secchips").innerHTML=SECS.map(([k,l])=>`<button class="chip" type="button" data-sec="${k}" aria-pressed="${S.sec===k}">${l}</button>`).join("");
  document.querySelectorAll(".nav [data-v]").forEach(b=>{if(b.dataset.v===VIEW)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")})}
function setView(v){if(VIEW==="lab"&&v!=="lab"&&LABH.api)LABH.api.pause();VIEW=v;const lab=v==="lab";$("labhost").hidden=!lab;$("out").hidden=lab;document.querySelector("header.top").hidden=lab;syncTop();render();scrollTo(0,0)}
function render(){if(VIEW==="lab")return renderLab();if(VIEW==="lib")renderLib();else if(VIEW==="fav")renderFav();else if(VIEW==="bat")renderBat();else if(VIEW==="add")renderAdd();else renderMore()}
document.querySelector(".nav").onclick=e=>{const b=e.target.closest("[data-v]");if(!b)return;if(b.dataset.v==="add"&&VIEW!=="add")ED=null;if(b.dataset.v==="lib")S.only=null;setView(b.dataset.v)};
$("secchips").onclick=e=>{const b=e.target.closest("[data-sec]");if(!b)return;S.sec=b.dataset.sec;S.only=null;syncTop();render();scrollTo(0,0)};
$("fbtn").onclick=filterSheet;
let qT=null;$("q").oninput=e=>{clearTimeout(qT);qT=setTimeout(()=>{S.q=e.target.value.trim();S.only=null;render()},180)};

/* ---------- taps inside the list ---------- */
const BFAV2=BFAV;
$("out").addEventListener("click",e=>{const t=e.target;
  const cd=t.closest(".cd");if(cd&&EDIT&&cd.dataset.card&&VIEW!=="add"){e.preventDefault();picDialog(+cd.dataset.card,cd.dataset.form);return}
  const fv=t.closest("[data-fav]");if(fv){const k=fv.dataset.fav;if(FAVS[k])delete FAVS[k];else FAVS[k]=BYKEY[k]?{k,at:Date.now(),lib:true}:{k,at:Date.now(),...(BFAV2[k]||{})};lsSet("crd-favs",FAVS);
    document.querySelectorAll(`[data-fav="${k}"]`).forEach(b=>{const on=!!FAVS[k];b.setAttribute("aria-pressed",on);b.textContent=on?"♥":"♡"});if(VIEW==="fav"&&!FAVS[k]){const a=fv.closest(".dk");if(a)a.remove()}return}
  if(t.closest("[data-showall]")){S.only=null;render();return}
  const sd=t.closest("[data-side]");if(sd){BV.side=sd.dataset.side;BV.sort="";savePrefs();render();return}
  const art=t.closest(".dk");const d=art&&art.dataset.i!=null?D[+art.dataset.i]:null;
  const tb=t.closest("[data-tab]");if(tb&&d){d.active=+tb.dataset.tab;const open=!art.querySelector(".det").hidden;art.outerHTML=deckHTML(d);if(open){const a2=document.querySelector(`.dk[data-i="${d.i}"]`);const det=a2.querySelector(".det");det.innerHTML=detHTML(d);det.hidden=false}return}
  if(t.closest("[data-more]")&&d){const det=art.querySelector(".det");if(det.hidden){det.innerHTML=detHTML(d);det.hidden=false;t.closest("[data-more]").textContent="Hide details"}else{det.hidden=true;t.closest("[data-more]").textContent="Details"}return}
  const go=t.closest("[data-go]");if(go){S={...S,sec:"all",q:"",arch:"",spec:"",era:"",tower:"",only:+go.dataset.go};$("q").value="";if(VIEW!=="lib")setView("lib");else{syncTop();render();scrollTo(0,0)}return}
  const ar=t.closest("[data-arch]");if(ar){S={...S,arch:ar.dataset.arch,only:null,sec:"all"};syncTop();render();scrollTo(0,0);return}
  if(t.closest("[data-hide]")&&d){if(HIDDEN.has(d.key))HIDDEN.delete(d.key);else HIDDEN.add(d.key);lsSet("crd-hidden",[...HIDDEN]);if(HIDDEN.has(d.key)){art.remove();toast("Deck hidden. Unhide it from More.")}return}
  if(t.closest("[data-copy]")&&d){const v=d.variants[bestVar(d)];copyText(v.link);return}
  if(t.closest("[data-del]")&&d){const b=t.closest("[data-del]");if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Tap again to delete";return}USER=USER.filter(u=>u.key!==d.key);saveUser();render();toast("Deleted.");return}
  if(t.closest("[data-edit]")&&d&&d.userAdd){const u=d.userAdd,v=u.variants[0];ED={order:v.order.map(Number),roles:{...v.roles},tt:v.tt,title:u.title,arch:(u.arch||[]).join(", "),notes:u.notes||"",editing:u.key};setView("add");return}
  const sv=t.closest("[data-save-names]");if(sv){const j=JSON.parse(sv.dataset.saveNames);const order=j.names.map(n=>NAMEID[n]&&NAMEID[n][0]).filter(Boolean);const roles={};j.names.forEach(n=>{if(j.roles[n]&&NAMEID[n])roles[NAMEID[n][0]]=j.roles[n]});ED=null;startAdd({order,roles,tt:TTID[j.tower]||""},{title:bLabel(j.names,j.roles)});return}
});
function copyText(s){if(window.AndroidClip){AndroidClip.copy(s);toast("Link copied.");return}navigator.clipboard.writeText(s).then(()=>toast("Link copied."),()=>toast("Copying is blocked here."))}

/* ---------- shared from Clash Royale (Android share sheet) ---------- */
window.onSharedText=function(){let t="";try{t=window.AndroidShare?AndroidShare.take():""}catch(_){}if(!t)return;const p=parseDeckText(t);
  if(p&&p.order.length){startAdd(p);toast("Deck received. Check the Evo and Hero slots, then save.")}else toast("That share didn't contain a deck link.")};

/* ---------- boot ---------- */
(async()=>{rebuild();syncTop();render();await Promise.all([loadPics(),loadBattles()]);render();window.onSharedText()})();
</script>
